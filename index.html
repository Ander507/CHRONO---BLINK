function drawCoins(g){
  if(!coins.length) return;
  g.save();
  for(var i=0;i<coins.length;i++){
    var c = coins[i];
    var pulse = 0.92 + 0.08 * Math.sin(globalT * 7 + c.born * 3);
    var a = clamp(c.life / 1.2, 0, 1);
    var r = c.r * pulse;
    var spin = c.born * 2.2;
    g.globalAlpha = a;
    g.save();
    g.translate(c.x, c.y);
    g.rotate(spin);
    // Flat hex coin — silhouette reads as loot, not an orb.
    glow(g, COL.amber, 7);
    g.fillStyle = 'rgba(232,184,109,0.22)';
    poly(g, 0, 0, r * 1.45, 6, 0);
    g.fill();
    g.fillStyle = COL.amber;
    poly(g, 0, 0, r * 1.05, 6, 0);
    g.fill();
    noGlow(g);
    g.strokeStyle = 'rgba(255,236,190,0.95)';
    g.lineWidth = 1.6;
    poly(g, 0, 0, r * 1.05, 6, 0);
    g.stroke();
    g.strokeStyle = 'rgba(12,11,16,0.55)';
    g.lineWidth = 1.2;
    poly(g, 0, 0, r * 0.62, 6, 0);
    g.stroke();
    g.fillStyle = COL.ink;
    g.beginPath();
    g.arc(0, 0, r * 0.18, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }
  g.restore();
  noGlow(g);
}

function drawKeyCap(g, x, y, w, h, label, lit){
  g.fillStyle = lit ? 'rgba(125,232,214,0.35)' : 'rgba(12,11,16,0.72)';
  g.fillRect(x, y, w, h);
  g.strokeStyle = lit ? COL.cyan : 'rgba(242,236,228,0.35)';
  g.lineWidth = 1.5;
  g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  mono(g, Math.max(11, h * 0.38), '600');
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = lit ? COL.cyan : COL.white;
  g.fillText(label, x + w * 0.5, y + h * 0.52);
}

function drawControlOverlay(g, S){
  if(!tutorial.active || isTouchUI()) return;
  var kw = Math.max(28, 32 * S), kh = kw, gap = 6 * S;
  var ox = W * 0.5 - (kw * 3 + gap * 2) * 0.5;
  var oy = H * 0.78;
  var litW = !!(keys['KeyW']||keys['KeyZ']);
  var litA = !!(keys['KeyA']||keys['KeyQ']);
  var litS = !!keys['KeyS'];
  var litD = !!keys['KeyD'];
  drawKeyCap(g, ox + kw + gap, oy - kh - gap, kw, kh, 'W', litW);
  drawKeyCap(g, ox, oy, kw, kh, 'A', litA);
  drawKeyCap(g, ox + kw + gap, oy, kw, kh, 'S', litS);
  drawKeyCap(g, ox + (kw + gap) * 2, oy, kw, kh, 'D', litD);
  mono(g, Math.max(10, 11 * S), '500');
  g.textAlign = 'center';
  g.fillStyle = COL.mute;
  g.fillText('ZQSD also works', W * 0.5, oy + kh + 16 * S);
  var sw = Math.max(88, 100 * S), sh = Math.max(28, 32 * S);
  drawKeyCap(g, W * 0.5 - sw * 0.5, oy - kh * 2 - gap * 3, sw, sh, 'SPACE / RMB', !!(keys['Space']||mouse.right));
}

function drawShopPanel(g, cx, topY, S, maxW, opts){
  shopBtns.length = 0;
  opts = opts || {};
  var compact = !!opts.compact;
  var panelW = Math.min(maxW || 420 * S, W - (compact ? 24 : 40) * S);
  var rowH = opts.rowH != null ? opts.rowH : (compact ? Math.max(28, 30 * S) : Math.max(32, 36 * S));
  var gap = opts.gap != null ? opts.gap : (compact ? 5 : 8 * S);
  var padX = compact ? Math.max(8, 10 * S) : 12 * S;
  var x0 = cx - panelW * 0.5;
  mono(g, Math.max(10, compact ? 11 : 12 * S), '600');
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = COL.amber;
  g.fillText('CREDITS  ' + bankedCoins, cx, topY);
  var y = topY + (compact ? 14 : 18 * S);
  for(var i=0;i<SHOP_ITEMS.length;i++){
    var it = SHOP_ITEMS[i];
    var lvl = upgrades[it.id]|0;
    var cost = upgradeCost(it.id);
    var maxed = lvl >= UPGRADE_MAX;
    var can = !maxed && bankedCoins >= cost;
    var btn = { id: it.id, x: x0, y: y, w: panelW, h: rowH };
    shopBtns.push(btn);
    var hovered = hitBtn(btn, rawMouse.x, rawMouse.y);
    g.fillStyle = hovered && can ? 'rgba(232,184,109,0.22)' : 'rgba(242,236,228,0.06)';
    g.fillRect(btn.x, btn.y, btn.w, btn.h);
    g.strokeStyle = can ? COL.amber : 'rgba(242,236,228,0.18)';
    g.lineWidth = 1;
    g.strokeRect(btn.x + 0.5, btn.y + 0.5, btn.w - 1, btn.h - 1);
    g.textAlign = 'left';
    uiFont(g, Math.max(12, compact ? 13 : 14 * S), '700');
    g.fillStyle = COL.white;
    g.fillText(it.name + '  Lv ' + lvl + '/' + UPGRADE_MAX, btn.x + padX, btn.y + (compact ? rowH * 0.5 : rowH * 0.38));
    if(!compact){
      mono(g, Math.max(10, 11 * S), '500');
      g.fillStyle = COL.mute;
      g.fillText(it.hint, btn.x + padX, btn.y + rowH * 0.72);
    }
    g.textAlign = 'right';
    displayFont(g, Math.max(12, compact ? 13 : 14 * S), '800');
    g.fillStyle = maxed ? COL.cyan : (can ? COL.amber : COL.mute);
    g.fillText(maxed ? 'MAX' : (cost + ' BUY'), btn.x + btn.w - padX, btn.y + rowH * 0.52);
    y += rowH + gap;
  }
  return y;
}

function hitBtn(btn, x, y){
  return btn.w > 0 && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;
}

function goToMenu(){
  if(state === 'over') settleRunCoins(1);
  cgGameplayStop();
  state = 'title';
  paused = false;
  menuHover = false;
  menuHoverB = false;
  anyRequest = false;
  dashRequest = false;
  moveTouch = null;
  aimTouch = null;
  canvas.style.cursor = 'default';
  resetGame();
  tutorial.active = false;
  tutorial.prompt = '';
  state = 'title';
  seedTitleAmbient();
  SFX.resume();
}

function drawMenuButton(g, btn, label, fill, textCol, hovered){
  g.fillStyle = hovered ? fill : fill;
  g.globalAlpha = hovered ? 1 : 0.88;
  g.fillRect(btn.x, btn.y, btn.w, btn.h);
  g.globalAlpha = 1;
  displayFont(g, Math.max(16, Math.min(20, btn.h * 0.42)), '800');
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = textCol;
  g.fillText(label, btn.x + btn.w * 0.5, btn.y + btn.h * 0.52);
}

function drawTitle(g){
  g.save();
  var S = Math.max(1, Math.min(W, H) / 800);
  var cx = W * 0.5;
  var touch = isTouchUI();
  var narrow = W < 700;
  var margin = Math.max(20, 24 * S);
  var reduceMotion = false;
  try {
    reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch(err){}

  var vg = g.createRadialGradient(cx, H * 0.4, 24, cx, H * 0.42, Math.max(W, H) * 0.55);
  vg.addColorStop(0, 'rgba(12,11,16,0.9)');
  vg.addColorStop(0.55, 'rgba(12,11,16,0.48)');
  vg.addColorStop(1, 'rgba(12,11,16,0)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);

  // Fit the brand to the viewport — no clipping, no decorative slash.
  var brandSize = Math.min(narrow ? 52 : 72, (W - margin * 2) / 5.2);
  displayFont(g, brandSize, '800');
  while(brandSize > 28 && g.measureText('CHRONO').width > W - margin * 2){
    brandSize -= 1;
    displayFont(g, brandSize, '800');
  }
  var blinkSize = Math.max(22, brandSize * 0.72);
  var blockH = brandSize + blinkSize + 18 * S;
  var y0 = Math.max(margin + brandSize * 0.7, H * (narrow ? 0.1 : 0.12));

  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  displayFont(g, brandSize, '800');
  g.fillStyle = COL.white;
  g.shadowColor = 'rgba(0,0,0,0.55)';
  g.shadowBlur = 8;
  g.fillText('CHRONO', cx, y0);
  noGlow(g);

  displayFont(g, blinkSize, '800');
  g.fillStyle = COL.cyan;
  g.fillText('BLINK', cx, y0 + blinkSize + 6 * S);

  var y = y0 + blinkSize + 28 * S;
  uiFont(g, Math.max(14, 15 * S), '600');
  g.fillStyle = COL.mute;
  g.fillText('Time only moves when you do.', cx, y);

  y += 22 * S;
  mono(g, Math.max(12, 12 * S), '600');
  g.fillStyle = COL.white;
  g.fillText('best  ' + pad6(highScore), cx, y);

  y += 28 * S;
  var hint = touch
    ? 'Left thumb move · Right drag to blink'
    : 'WASD / ZQSD · Aim · Space / RMB to blink';
  uiFont(g, Math.max(13, 14 * S), '600');
  g.fillStyle = 'rgba(242,236,228,0.7)';
  var hs = Math.max(12, 14 * S);
  while(hs > 11){
    uiFont(g, hs, '600');
    if(g.measureText(hint).width <= W - margin * 2) break;
    hs -= 0.5;
  }
  g.fillText(hint, cx, y);

  y += 22 * S;
  y = drawShopPanel(g, cx, y, S, Math.min(420 * S, W - margin * 2));

  var pulse = reduceMotion ? 0.75 : (0.55 + 0.45 * (0.5 + 0.5 * Math.sin(titleT * 2.4)));
  var ctaLabel = 'PLAY';
  displayFont(g, Math.max(18, 20 * S), '800');
  var btnH = Math.max(touch ? 42 : 48, (touch ? 44 : 50) * S);
  var ctaW = Math.min(W - margin * 2, Math.max(180 * S, 240 * S));
  var btnY = Math.min(H - btnH - margin - (touch ? 20 : 8), Math.max(y + 16 * S, H * (narrow ? 0.78 : 0.8)));
  deployBtn.x = cx - ctaW * 0.5;
  deployBtn.y = btnY;
  deployBtn.w = ctaW;
  deployBtn.h = btnH;
  againBtn.w = 0; menuBtn.w = 0;
  menuHover = hitBtn(deployBtn, rawMouse.x, rawMouse.y);
  menuHoverB = false;
  var shopHot = false;
  for(var si=0;si<shopBtns.length;si++){
    if(hitBtn(shopBtns[si], rawMouse.x, rawMouse.y)){ shopHot = true; break; }
  }
  canvas.style.cursor = (menuHover || shopHot) ? 'pointer' : 'default';

  g.fillStyle = menuHover ? COL.cyan : 'rgba(125,232,214,' + (0.8 + 0.2 * pulse).toFixed(3) + ')';
  g.fillRect(deployBtn.x, deployBtn.y, deployBtn.w, deployBtn.h);
  g.fillStyle = COL.ink;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  displayFont(g, Math.max(18, 20 * S), '800');
  g.fillText(ctaLabel, cx, btnY + btnH * 0.52);

  mono(g, Math.max(10, 11 * S), '500');
  g.fillStyle = COL.mute;
  g.textBaseline = 'top';
  g.fillText(touch ? 'tap PLAY' : 'enter / space  ·  M mute', cx, btnY + btnH + 8 * S);

  g.restore();
  noGlow(g);
}

function drawGameOver(g){
  g.save();
  var S = Math.max(1, Math.min(W, H) / 800);
  var touch = isTouchUI();
  var landscape = W > H;
  var short = H < 560;
  var narrow = W < 700 || (touch && !landscape);
  var compact = touch || short;
  var padX = Math.max(12, compact ? 14 : 20 * S);
  var topSafe = Math.max(10, compact ? 12 : 16 * S);
  var bottomSafe = Math.max(compact ? 20 : 14, touch ? 28 : 14);

  g.fillStyle = 'rgba(12,11,16,0.86)';
  g.fillRect(0, 0, W, H);

  var cx = W * 0.5;
  var isNew = (score >= highScore && score > 0);
  var showDouble = cgAdsOk() && !rewardClaimed && runCoins > 0;
  var showRevive = cgAdsOk() && !reviveUsed;
  var adsSide = touch && showDouble && showRevive;

  var btnH = compact
    ? Math.max(34, Math.min(40, Math.round(H * 0.052)))
    : Math.max(42, 46 * S);
  var gap = compact ? 6 : 8 * S;
  var tipH = 14;
  var adBlockH = 0;
  if(showDouble || showRevive){
    adBlockH = adsSide ? btnH : (((showDouble?1:0)+(showRevive?1:0)) * (btnH + gap) - gap);
  }
  var actionH = adBlockH + (adBlockH ? gap : 0) + btnH + tipH;
  var actionTop = H - bottomSafe - actionH;

  var shopRowH = compact ? Math.max(26, Math.min(32, Math.round(H * 0.042))) : Math.max(32, 36 * S);
  var shopGap = compact ? 4 : 8 * S;
  var shopH = (compact ? 14 : 18 * S) + 3 * (shopRowH + shopGap);
  var shopTop = actionTop - shopH - (compact ? 8 : 12 * S);

  // Content column(s) above the shop
  var contentBottom = shopTop - (compact ? 6 : 10 * S);
  var contentTop = topSafe;
  var twoCol = landscape && short && W >= 640;
  var leftCx = twoCol ? W * 0.28 : cx;
  var rightCx = twoCol ? W * 0.72 : cx;
  var tableW = Math.min(twoCol ? W * 0.42 : 400 * S, W - padX * 2);
  if(twoCol) tableW = Math.min(tableW, W * 0.44);

  var ts = Math.max(20, Math.min(compact ? 32 : 44 * S, W * (twoCol ? 0.07 : 0.11)));
  var rowH = compact ? Math.max(18, Math.min(24, Math.round(H * 0.032))) : Math.max(24, 28 * S);
  var rows = [
    ['Score', String(score)],
    ['Coins', '+' + runCoins],
    ['Best combo', bestCombo + '×'],
    ['Cuts', String(kills)],
    ['Lived', elapsed.toFixed(1) + 's']
  ];
  if(compact && short){
    rows = [
      ['Score', String(score)],
      ['Coins', '+' + runCoins],
      ['Combo / Cuts', bestCombo + '×  ·  ' + kills],
      ['Lived', elapsed.toFixed(1) + 's']
    ];
  }
  var tableH = rows.length * rowH;

  var y0 = contentTop;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  displayFont(g, ts, '800');
  g.fillStyle = COL.white;
  g.fillText("Time's up", leftCx, y0 + ts * 0.85);

  var tableY = y0 + ts + (compact ? 8 : 12 * S);
  var tableX = leftCx - tableW * 0.5;
  var i;
  for(i=0;i<rows.length;i++){
    var ry = tableY + i * rowH;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    uiFont(g, Math.max(12, compact ? 13 : 14 * S), '600');
    g.fillStyle = COL.mute;
    g.fillText(rows[i][0], tableX, ry + rowH * 0.5);
    g.textAlign = 'right';
    displayFont(g, Math.max(14, compact ? 15 : 18 * S), '800');
    g.fillStyle = (i === 0) ? COL.cyan : ((i === 1) ? COL.amber : COL.white);
    g.fillText(rows[i][1], tableX + tableW, ry + rowH * 0.5);
  }

  g.strokeStyle = 'rgba(242,236,228,0.18)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(tableX, tableY + tableH + 2);
  g.lineTo(tableX + tableW, tableY + tableH + 2);
  g.stroke();

  var afterTable = tableY + tableH + (compact ? 8 : 12 * S);
  if(deathCause && !(compact && short && twoCol)){
    var causeLabel = deathCause === 'projectile' ? 'an orb'
      : deathCause === 'gunner' ? 'a gunner'
      : deathCause === 'phantom' ? 'a phantom'
      : deathCause === 'stalker' ? 'a stalker'
      : 'the room';
    mono(g, Math.max(10, 11 * S), '600');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.amber;
    g.fillText('Stopped by ' + causeLabel, leftCx, afterTable);
    if(!compact || !short){
      uiFont(g, Math.max(11, 12 * S), '600');
      g.fillStyle = COL.mute;
      g.fillText(deathTip || tipForDeath(deathCause), leftCx, afterTable + 14 * S);
      afterTable += 28 * S;
    } else {
      afterTable += 16;
    }
  }
  if(isNew){
    displayFont(g, Math.max(12, compact ? 13 : 15 * S), '800');
    g.fillStyle = COL.amber;
    g.fillText('New best', leftCx, afterTable);
    afterTable += compact ? 14 : 20 * S;
  }

  // Shop: right column in landscape, otherwise under stats (anchored above actions)
  var shopCx = twoCol ? rightCx : cx;
  var shopW = twoCol ? Math.min(W * 0.46, W - padX * 2) : Math.min(400 * S, W - padX * 2);
  var shopY = twoCol ? contentTop + 4 : Math.min(shopTop, Math.max(afterTable + 4, shopTop));
  // If content ran long, pin shop to reserved band so buttons stay on-screen.
  if(!twoCol) shopY = shopTop;
  drawShopPanel(g, shopCx, shopY, S, shopW, {
    compact: compact,
    rowH: shopRowH,
    gap: shopGap
  });

  deployBtn.w = 0;
  rewardBtn.w = 0;
  reviveBtn.w = 0;

  var rw = Math.min(shopW, W - padX * 2);
  var adY = actionTop;
  if(showDouble || showRevive){
    if(adsSide){
      var half = (rw - gap) * 0.5;
      rewardBtn.x = cx - rw * 0.5;
      rewardBtn.y = adY;
      rewardBtn.w = half;
      rewardBtn.h = btnH;
      reviveBtn.x = rewardBtn.x + half + gap;
      reviveBtn.y = adY;
      reviveBtn.w = half;
      reviveBtn.h = btnH;
      adY += btnH + gap;
    } else {
      if(showDouble){
        rewardBtn.x = cx - rw * 0.5;
        rewardBtn.y = adY;
        rewardBtn.w = rw;
        rewardBtn.h = btnH;
        adY += btnH + gap;
      }
      if(showRevive){
        reviveBtn.x = cx - rw * 0.5;
        reviveBtn.y = adY;
        reviveBtn.w = rw;
        reviveBtn.h = btnH;
        adY += btnH + gap;
      }
    }
  }

  var navW = rw;
  var halfW = (navW - gap) * 0.5;
  againBtn.w = halfW;
  againBtn.h = btnH;
  againBtn.x = cx - navW * 0.5;
  againBtn.y = adY;
  menuBtn.w = halfW;
  menuBtn.h = btnH;
  menuBtn.x = againBtn.x + halfW + gap;
  menuBtn.y = againBtn.y;

  menuHover = hitBtn(againBtn, rawMouse.x, rawMouse.y);
  menuHoverB = hitBtn(menuBtn, rawMouse.x, rawMouse.y);
  menuHoverR = showDouble && hitBtn(rewardBtn, rawMouse.x, rawMouse.y);
  menuHoverV = showRevive && hitBtn(reviveBtn, rawMouse.x, rawMouse.y);
  var shopHot = false;
  for(var si=0;si<shopBtns.length;si++){
    if(hitBtn(shopBtns[si], rawMouse.x, rawMouse.y)){ shopHot = true; break; }
  }
  canvas.style.cursor = (menuHover || menuHoverB || menuHoverR || menuHoverV || shopHot) ? 'pointer' : 'default';

  var pulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.abs(Math.sin(globalT * 2.6)));
  var adLabelSize = Math.max(11, Math.min(14, btnH * 0.36));

  if(showDouble){
    g.fillStyle = menuHoverR ? COL.amber : 'rgba(232,184,109,0.88)';
    g.fillRect(rewardBtn.x, rewardBtn.y, rewardBtn.w, rewardBtn.h);
    displayFont(g, adLabelSize, '800');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.ink;
    g.fillText(adsSide ? '2× COINS' : 'WATCH AD  ·  2× COINS', rewardBtn.x + rewardBtn.w * 0.5, rewardBtn.y + btnH * 0.52);
  } else if(rewardClaimed){
    mono(g, Math.max(10, 11 * S), '600');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.amber;
    g.fillText('2× coins claimed', cx, againBtn.y - gap - 4);
  }

  if(showRevive){
    g.fillStyle = menuHoverV ? 'rgba(125,232,214,0.55)' : 'rgba(125,232,214,0.22)';
    g.fillRect(reviveBtn.x, reviveBtn.y, reviveBtn.w, reviveBtn.h);
    g.strokeStyle = COL.cyan;
    g.lineWidth = 1.5;
    g.strokeRect(reviveBtn.x + 0.5, reviveBtn.y + 0.5, reviveBtn.w - 1, reviveBtn.h - 1);
    displayFont(g, adLabelSize, '800');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.cyan;
    g.fillText(adsSide ? 'REVIVE' : 'WATCH AD  ·  REVIVE', reviveBtn.x + reviveBtn.w * 0.5, reviveBtn.y + btnH * 0.52);
  }

  g.fillStyle = menuHover ? COL.white : 'rgba(242,236,228,' + (0.86 + 0.14 * pulse).toFixed(3) + ')';
  g.fillRect(againBtn.x, againBtn.y, againBtn.w, againBtn.h);
  displayFont(g, Math.max(13, Math.min(17, btnH * 0.4)), '800');
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = COL.ink;
  g.fillText('AGAIN', againBtn.x + againBtn.w * 0.5, againBtn.y + btnH * 0.52);

  g.fillStyle = menuHoverB ? 'rgba(125,232,214,0.35)' : 'rgba(125,232,214,0.14)';
  g.fillRect(menuBtn.x, menuBtn.y, menuBtn.w, menuBtn.h);
  g.strokeStyle = COL.cyan;
  g.lineWidth = 1.5;
  g.strokeRect(menuBtn.x + 0.5, menuBtn.y + 0.5, menuBtn.w - 1, menuBtn.h - 1);
  g.fillStyle = COL.cyan;
  g.fillText('MENU', menuBtn.x + menuBtn.w * 0.5, menuBtn.y + btnH * 0.52);

  mono(g, Math.max(9, 10 * S), '500');
  g.fillStyle = COL.mute;
  g.textBaseline = 'top';
  g.fillText(touch ? 'ads optional  ·  tap a button' : 'ads optional  ·  enter = again', cx, againBtn.y + btnH + 4);

  g.restore();
  noGlow(g);
}

function drawWorld(g){
  g.save();

  // Rotating as well as translating is what makes an impact feel like a physical
  // jolt. The angle stays tiny because even a couple of degrees is a lot here.
  if(shake.mag > 0 || shake.rot > 0){
    var ox = rand(-1,1) * shake.mag;
    var oy = rand(-1,1) * shake.mag;
    var rot = rand(-1,1) * shake.rot;
    g.translate(W/2 + ox - cam.x, H/2 + oy - cam.y);
    g.rotate(rot);
    g.translate(-W/2, -H/2);
  } else if(state === 'playing' && (cam.x || cam.y)){
    g.translate(-cam.x, -cam.y);
  }

  drawGrid(g);
  drawDust(g);
  drawTrails(g);
  drawRings(g);
  drawShards(g);
  drawProjectiles(g);
  drawEnemies(g);
  drawCoins(g);
  if(state === 'playing') drawPlayer(g);
  drawFloaters(g);

  g.restore();

  // Outside the shake transform, or the dark corners would visibly slide and give
  // away that the whole scene is being nudged around.
  drawVignette(g);
  drawComboHeat(g);
  if(state === 'playing'){
    drawTouchUI(g);
    drawHUD(g);
  }
  if(state === 'title') drawTitle(g);
  if(state === 'over')  drawGameOver(g);
}

function render(){
  // The aberration path costs two extra full-screen composites, so it only runs
  // while the effect is actually visible. The rest of the time the frame goes
  // straight to the display canvas and none of this happens.
  // RGB split is the heaviest frame cost — only for a short punch, not a simmer.
  var useBuffer = (aber > 0.08);
  var g = useBuffer ? bctx : ctx;

  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  noGlow(g);
  g.fillStyle = COL.bg;
  g.fillRect(0,0,W,H);

  drawWorld(g);

  if(useBuffer){
    // Real RGB split, without ever reading pixels back. Multiplying the frame by
    // pure red leaves only the red channel; multiplying by cyan leaves green and
    // blue. Adding those two halves back with 'lighter' reconstructs the original
    // exactly, so nudging them in opposite directions is what tears the colour
    // apart — and it lands back on the untouched image as the effect decays.
    //
    // Everything here works in device pixels, hence the identity transforms and
    // the *DPR on the offsets.
    var d = aber * 5.5;

    cctx.setTransform(1,0,0,1,0,0);
    cctx.globalCompositeOperation = 'source-over';
    cctx.clearRect(0,0,chan.width,chan.height);
    cctx.drawImage(buf, 0, 0);
    cctx.globalCompositeOperation = 'multiply';
    cctx.fillStyle = '#ff0000';
    cctx.fillRect(0,0,chan.width,chan.height);

    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    noGlow(ctx);
    // Must be opaque black rather than cleared: 'lighter' against transparency
    // produces washed-out edges.
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(chan, -d*DPR, 0);

    cctx.globalCompositeOperation = 'source-over';
    cctx.clearRect(0,0,chan.width,chan.height);
    cctx.drawImage(buf, 0, 0);
    cctx.globalCompositeOperation = 'multiply';
    cctx.fillStyle = '#00ffff';
    cctx.fillRect(0,0,chan.width,chan.height);
    ctx.drawImage(chan, d*DPR, 0);

    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // 'difference' against white inverts whatever is underneath, which is a one-fill
  // way to get a full-screen negative flash on a big multi-kill.
  if(invert > 0.04){
    ctx.save();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation = 'difference';
    ctx.globalAlpha = Math.min(0.55, invert * 0.55);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  // Skip scanlines while the expensive aber path is active.
  if(scanPattern && !useBuffer){
    ctx.save();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalAlpha = 0.02;
    ctx.fillStyle = scanPattern;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function startGame(){
  if(state === 'over') settleRunCoins(1);
  resetGame();
  state = 'playing';
  menuHover = false;
  canvas.style.cursor = 'none';
  SFX.start();
  anyRequest = false;
  dashRequest = false;
  cgGameplayStart();
}

var last = 0;
function frame(now){
  // First frame has no previous timestamp, and rAF hands us a page-relative time
  // that can already be seconds in — without this the run opens with a huge dt.
  if(!last) last = now;
  // Capped at 100ms. Come back to a backgrounded tab and the real gap is measured
  // in seconds, which would teleport every enemy straight through the player. A
  // capped step means the world simply advances less than real time, which nobody
  // notices, rather than tunnelling.
  var dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // The menu states run their own trimmed-down update. They still need particles and
  // effect decay ticking over, but nothing that could kill or score.
  if(state === 'title'){
    titleT += dt;
    globalT += dt;
    aber   = Math.max(0, aber - dt*4.2);
    invert = Math.max(0, invert - dt*8);
    shake.mag *= Math.pow(0.0016, dt);
    shake.rot *= Math.pow(0.0016, dt);
    updateTitleAmbient(dt);
    for(var s=shards.length-1;s>=0;s--){
      var sh = shards[s];
      sh.x += sh.vx*dt; sh.y += sh.vy*dt;
      sh.vx *= (1-2.1*dt); sh.vy *= (1-2.1*dt);
      sh.ang += sh.spin*dt; sh.life -= dt;
      if(sh.life <= 0) shards.splice(s,1);
    }
    for(var q=pops.length-1;q>=0;q--){ pops[q].life -= dt; if(pops[q].life<=0) pops.splice(q,1); }
    anyRequest = false;
  } else if(state === 'playing'){
    if(CG.adOpen || finishingFlow){
      globalT += dt;
    } else if(!paused) update(dt);
    else globalT += dt;
    anyRequest = false;
  } else {
    // Game over: the death explosion keeps playing behind the stats panel.
    globalT += dt;
    aber   = Math.max(0, aber - dt*4.2);
    invert = Math.max(0, invert - dt*8);
    shake.mag *= Math.pow(0.0016, dt);
    shake.rot *= Math.pow(0.0016, dt);
    var sdt = dt*0.8;
    for(var s2=shards.length-1;s2>=0;s2--){
      var h = shards[s2];
      h.x += h.vx*sdt; h.y += h.vy*sdt;
      h.vx *= (1-2.1*sdt); h.vy *= (1-2.1*sdt);
      h.ang += h.spin*sdt; h.life -= sdt;
      if(h.life <= 0) shards.splice(s2,1);
    }
    for(var q2=pops.length-1;q2>=0;q2--){ pops[q2].life -= dt; if(pops[q2].life<=0) pops.splice(q2,1); }
    for(var f=floaters.length-1;f>=0;f--){ floaters[f].life -= dt; if(floaters[f].life<=0) floaters.splice(f,1); }
    anyRequest = false;
    dashRequest = false;
  }

  render();
  requestAnimationFrame(frame);
}

// Boot game immediately (file:// safe). SDK loads in the background on http(s).
function bootTitle(){
  loadProgress();
  resetGame();
  tutorial.active = false;
  tutorial.prompt = '';
  state = 'title';
  seedTitleAmbient();
  requestAnimationFrame(frame);
}
bootTitle();
applySdkMute(null); // honor ?muteAudio=true even before SDK
loadCrazyGamesSdkScript()
  .then(function(ok){ return ok ? initCrazyGames() : false; })
  .then(function(ready){ if(ready) loadProgress(); })
  .catch(function(){});

// Opt-in playtest bridge — only when ?harness=1 so normal play stays untouched.
if(/[?&]harness=1(?:&|$)/.test(location.search)){
  window.__CHRONO__ = {
    get: function(){
      return {
        state: state,
        score: score,
        combo: combo,
        comboTimer: comboTimer,
        bestCombo: bestCombo,
        kills: kills,
        wave: wave,
        elapsed: elapsed,
        cd: player ? player.cd : 0,
        alive: player ? player.alive : false,
        tutorial: tutorial.active ? tutorial.step : -1,
        runCoins: runCoins,
        bankedCoins: bankedCoins,
        upgrades: { reach: upgrades.reach, recovery: upgrades.recovery, magnet: upgrades.magnet },
        cg: { ready: CG.ready, env: CG.env, adOpen: CG.adOpen },
        W: W, H: H
      };
    },
    start: function(opts){
      opts = opts || {};
      if(opts.skipTutorial){
        tutorialSeen = true;
        try { storeSet(TUT_KEY, '1'); } catch(e){}
      }
      startGame();
      if(opts.skipTutorial){
        tutorial.active = false;
        tutorial.prompt = '';
      }
    },
    aimAt: function(x, y){
      rawMouse.x = x; rawMouse.y = y;
      aim.x = x; aim.y = y;
      aim.angle = Math.atan2(y - player.y, x - player.x);
    },
    dash: function(){ dashRequest = true; },
    move: function(codes){
      keys = Object.create(null);
      (codes || []).forEach(function(c){ keys[c] = true; });
    },
    stageCombo: function(n){
      combo = Math.max(0, n|0);
      comboTimer = COMBO_TIME + Math.min(2.4, combo * 0.1);
      comboFlash = 1;
      comboPulse = Math.min(1, 0.4 + Math.min(0.55, combo * 0.04));
      if(player && player.alive) triggerComboFx(combo, false);
    },
    menu: function(){ goToMenu(); },
    skipTutorial: function(){ skipTutorial(); },
    setCoins: function(n){
      bankedCoins = Math.max(0, n|0);
      saveBank();
    },
    buy: function(id){ return tryBuyUpgrade(id); },
    setDashCd: function(t){
      if(player) player.cd = Math.max(0, t);
    },
    aimNearest: function(){
      if(!player || !enemies.length) return false;
      var best = null, bestD = 1e15;
      for(var i=0;i<enemies.length;i++){
        var e = enemies[i];
        var d = len(e.x - player.x, e.y - player.y);
        if(d < bestD){ bestD = d; best = e; }
      }
      if(!best) return false;
      this.aimAt(best.x, best.y);
      return true;
    },
    stageOver: function(opts){
      opts = opts || {};
      score = opts.score != null ? opts.score : 4200;
      bestCombo = opts.bestCombo != null ? opts.bestCombo : 7;
      kills = opts.kills != null ? opts.kills : 18;
      elapsed = opts.elapsed != null ? opts.elapsed : 42.5;
      runCoins = opts.runCoins != null ? opts.runCoins : 18;
      runCoinBanked = false;
      overSettled = false;
      rewardClaimed = false;
      deathCause = opts.cause || 'stalker';
      deathTip = tipForDeath(deathCause);
      if(score > highScore) highScore = score;
      gameFinished = true;
      state = 'over';
      player.alive = false;
    },
    canvas: canvas
  };
}

})();
</script>
