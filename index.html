<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14131a">
<title>CHRONO — BLINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#14131a;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:none;
  }
  canvas{
    display:block;position:fixed;inset:0;
    width:100%;height:100%;
    touch-action:none;
    image-rendering:auto;
    cursor:none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
"use strict";

// CHRONO // BLINK — single-file arcade. Optional CrazyGames SDK (ads, cloud
// save, gameplay events). Offline / file:// still runs with localStorage only.

var COL = {
  bg:    '#14131a',
  grid:  '#2a2833',
  cyan:  '#7de8d6',
  cyanD: '#3a8f84',
  red:   '#e8453c',
  redD:  '#8a2a24',
  white: '#f2ece4',
  amber: '#e8b86d',
  violet:'#9a8fd4',
  violetD:'#5a5288',
  ink:   '#0c0b10',
  mute:  'rgba(242,236,228,0.55)'
};

// Time never fully stops. At 0.08 the world still creeps, which keeps the
// screen alive while you plan and stops the pause from feeling like a freeze.
// TIME_LERP is what makes the shift a swell rather than a hard gear change.
var TIME_IDLE      = 0.08;
var TIME_ACTIVE    = 1.00;
var TIME_LERP      = 9.0;

var PLAYER_R       = 9;
var PLAYER_SPEED   = 335;
var DASH_DIST      = 240;
var DASH_TIME      = 0.115;
var DASH_COOLDOWN  = 1.2;
// A sliver of invulnerability after you land, so you don't die to an enemy
// that drifted into the spot you were always going to arrive at.
var DASH_GRACE     = 0.06;

var WAVE_INTERVAL  = 10;

var PROJ_SPEED     = 165;
var PROJ_R         = 6;

// Slices read as generous on purpose. Pixel-exact hitboxes on a 240px lunge
// feel broken even when they're correct, so the blade is fattened by this much.
var SLICE_PAD      = 13;

var HS_KEY = 'chronoBlink.highScore.v1';
var TUT_KEY = 'chronoBlink.tutorial.v1';
var COINS_KEY = 'chronoBlink.coins.v1';
var UP_KEY = 'chronoBlink.upgrades.v1';
var NEAR_MISS_PAD = 34;
var CHAIN_WINDOW  = 0.42;
var COMBO_TIME    = 2.75; // real seconds; no kill before this and the chain dies
var MAGNET_R_BASE = 180;
var MAGNET_T_BASE = 0.45;
var UPGRADE_COSTS = [25, 60, 120];
var UPGRADE_MAX = 3;
var REWARD_COINS = 25; // unused legacy; 2× uses runCoins

// ---- CrazyGames SDK (safe no-op offline / file:// / disabled env) ----
var CG = {
  ready: false,
  env: 'offline',
  sdk: null,
  data: null,
  adOpen: false,
  muteWas: false,
  gameplayOn: false,
  sdkMute: false
};

function storeGet(key){
  if(CG.ready && CG.data){
    try {
      var v = CG.data.getItem(key);
      if(v != null) return v;
    } catch(e){}
  }
  try { return localStorage.getItem(key); } catch(e){ return null; }
}
function storeSet(key, value){
  value = String(value);
  if(CG.ready && CG.data){
    try {
      CG.data.setItem(key, value);
      return;
    } catch(e){}
  }
  try { localStorage.setItem(key, value); } catch(e){}
}
function cgCall(fn){
  if(!CG.ready || !CG.sdk) return;
  try { fn(CG.sdk); } catch(e){}
}
function cgLoadingStart(){ cgCall(function(s){ s.game.loadingStart(); }); }
function cgLoadingStop(){ cgCall(function(s){ s.game.loadingStop(); }); }
function cgGameplayStart(){
  if(CG.gameplayOn) return;
  CG.gameplayOn = true;
  cgCall(function(s){ s.game.gameplayStart(); });
}
function cgGameplayStop(){
  if(!CG.gameplayOn) return;
  CG.gameplayOn = false;
  cgCall(function(s){ s.game.gameplayStop(); });
}
function cgHappyTime(){ cgCall(function(s){ s.game.happytime(); }); }
function applySdkMute(settings){
  var mute = !!(settings && settings.muteAudio);
  if(/[?&]muteAudio=true(?:&|$)/.test(location.search)) mute = true;
  CG.sdkMute = mute;
  if(mute) SFX.muted = true;
}
function wireSdkSettings(){
  if(!CG.sdk || !CG.sdk.game) return;
  try {
    applySdkMute(CG.sdk.game.settings);
    if(typeof CG.sdk.game.addSettingsChangeListener === 'function'){
      CG.sdk.game.addSettingsChangeListener(function(s){ applySdkMute(s); });
    }
  } catch(e){}
}
function cgAdsOk(){
  return CG.ready && (CG.env === 'local' || CG.env === 'crazygames');
}
function cgAdBegin(){
  CG.adOpen = true;
  CG.muteWas = SFX.muted;
  SFX.muted = true;
  try { if(SFX.ac && SFX.ac.state === 'running') SFX.ac.suspend(); } catch(e){}
  paused = true;
}
function cgAdEnd(){
  CG.adOpen = false;
  SFX.muted = CG.sdkMute ? true : CG.muteWas;
  try { if(SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume(); } catch(e){}
  paused = false;
}
function cgRequestAd(type, onDone, onReward){
  var settled = false;
  function endAudio(){
    if(CG.adOpen) cgAdEnd();
  }
  function fail(){
    if(settled) return;
    settled = true;
    endAudio();
    if(onDone) onDone(false);
  }
  function win(){
    if(settled) return;
    settled = true;
    endAudio();
    if(onReward) onReward();
    if(onDone) onDone(true);
  }
  if(!cgAdsOk() || !CG.sdk || !CG.sdk.ad){
    if(onDone) onDone(false);
    return;
  }
  try {
    CG.sdk.ad.requestAd(type, {
      adStarted: function(){ cgAdBegin(); },
      adFinished: function(){ win(); },
      adError: function(){ fail(); }
    });
  } catch(e){
    fail();
  }
}
function cgMidgame(onDone){ if(onDone) onDone(false); }
function cgRewarded(onReward){ cgRequestAd('rewarded', null, onReward); }

function migrateLocalToData(){
  if(!CG.data) return;
  var keys = [HS_KEY, TUT_KEY, COINS_KEY, UP_KEY];
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    try {
      if(CG.data.getItem(k) != null) continue;
      var loc = null;
      try { loc = localStorage.getItem(k); } catch(e){}
      if(loc != null) CG.data.setItem(k, loc);
    } catch(e){}
  }
}
function loadProgress(){
  try { highScore = parseInt(storeGet(HS_KEY) || '0', 10) || 0; } catch(e){ highScore = 0; }
  try { tutorialSeen = storeGet(TUT_KEY) === '1'; } catch(e){ tutorialSeen = false; }
  try { bankedCoins = Math.max(0, parseInt(storeGet(COINS_KEY) || '0', 10) || 0); } catch(e){ bankedCoins = 0; }
  try {
    var rawUp = JSON.parse(storeGet(UP_KEY) || '{}');
    upgrades.reach = clamp(rawUp.reach|0, 0, UPGRADE_MAX);
    upgrades.recovery = clamp(rawUp.recovery|0, 0, UPGRADE_MAX);
    upgrades.magnet = clamp(rawUp.magnet|0, 0, UPGRADE_MAX);
  } catch(e){}
}
// Only pull CrazyGames when it can actually run: their host, localhost (SDK
// "local" env), an explicit ?cg=1, or a script the host already injected.
// Everywhere else (itch, GitHub Pages, random deploys) we skip the CDN hit —
// init would just land in environment "disabled" and every call would no-op.
function shouldUseCrazyGames(){
  if(location.protocol === 'file:') return false;
  if(window.CrazyGames && window.CrazyGames.SDK) return true;
  if(/[?&]cg=1(?:&|$)/.test(location.search)) return true;
  var h = (location.hostname || '').toLowerCase();
  if(h === 'localhost' || h === '127.0.0.1') return true;
  return h.indexOf('crazygames.') !== -1;
}
function initCrazyGames(){
  return new Promise(function(resolve){
    if(!shouldUseCrazyGames()){
      CG.env = 'offline';
      resolve(false);
      return;
    }
    var sdk = window.CrazyGames && window.CrazyGames.SDK;
    if(!sdk || typeof sdk.init !== 'function'){
      CG.env = 'offline';
      resolve(false);
      return;
    }
    var settled = false;
    function done(ok){
      if(settled) return;
      settled = true;
      resolve(!!ok);
    }
    setTimeout(function(){ done(false); }, 4000);
    sdk.init().then(function(){
      try { CG.env = sdk.environment || 'unknown'; } catch(e){ CG.env = 'unknown'; }
      if(CG.env === 'disabled'){
        CG.ready = false;
        done(false);
        return;
      }
      CG.ready = true;
      CG.sdk = sdk;
      CG.data = sdk.data || null;
      try { sdk.game.loadingStart(); } catch(e){}
      migrateLocalToData();
      loadProgress();
      wireSdkSettings();
      try { sdk.game.loadingStop(); } catch(e){}
      done(true);
    }).catch(function(){
      CG.ready = false;
      CG.env = 'offline';
      done(false);
    });
  });
}
function loadCrazyGamesSdkScript(){
  return new Promise(function(resolve){
    if(!shouldUseCrazyGames()){ resolve(false); return; }
    if(window.CrazyGames && window.CrazyGames.SDK){ resolve(true); return; }
    var s = document.createElement('script');
    s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
    s.async = true;
    var settled = false;
    function done(ok){
      if(settled) return;
      settled = true;
      resolve(!!ok);
    }
    s.onload = function(){ done(true); };
    s.onerror = function(){ done(false); };
    setTimeout(function(){ done(!!(window.CrazyGames && window.CrazyGames.SDK)); }, 4000);
    document.head.appendChild(s);
  });
}

var canvas = document.getElementById('game');
var ctx    = canvas.getContext('2d');

// Two spare canvases exist purely for the RGB-split effect. `buf` holds a clean
// copy of the frame and `chan` is scratch space for pulling one colour channel
// out of it. Both stay allocated because the effect fires several times a second
// during a good combo and churning canvases mid-run stutters.
var buf    = document.createElement('canvas');
var bctx   = buf.getContext('2d');
var chan   = document.createElement('canvas');
var cctx   = chan.getContext('2d');

var W = 0, H = 0, DPR = 1;
var scanPattern = null;
var dust = [];

// The scanlines used to be a fillRect per row, which on a tall display meant
// ~480 draw calls every frame for a static texture. A 1x3 repeating tile does
// the same job in one fill.
function buildScanPattern(){
  var t = document.createElement('canvas');
  t.width = 1; t.height = 4;
  var tc = t.getContext('2d');
  tc.fillStyle = '#000';
  tc.fillRect(0, 0, 1, 1);
  scanPattern = ctx.createPattern(t, 'repeat');
}

function resize(){
  // Phones report 3x and even 4x, which triples the fill cost of every glow.
  // 1.5 keeps edges clean without the full 2x fill tax.
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth;
  H = window.innerHeight;
  try {
    if(window.visualViewport && window.visualViewport.width){
      W = Math.max(1, Math.round(window.visualViewport.width));
      H = Math.max(1, Math.round(window.visualViewport.height));
    }
  } catch(err){}
  [ [canvas,ctx], [buf,bctx], [chan,cctx] ].forEach(function(p){
    p[0].width  = Math.max(1, Math.round(W * DPR));
    p[0].height = Math.max(1, Math.round(H * DPR));
    p[1].setTransform(DPR, 0, 0, DPR, 0, 0);
  });
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  buildScanPattern();
  if(typeof dust !== 'undefined' && dust) initDust();
  // Keep actors inside the new viewport after rotate / URL-bar resize.
  if(player){
    player.x = clamp(player.x, PLAYER_R, Math.max(PLAYER_R, W - PLAYER_R));
    player.y = clamp(player.y, PLAYER_R, Math.max(PLAYER_R, H - PLAYER_R));
  }
  if(Array.isArray(enemies)){
    for(var i=0;i<enemies.length;i++){
      var er = enemies[i].r || 12;
      enemies[i].x = clamp(enemies[i].x, er, Math.max(er, W - er));
      enemies[i].y = clamp(enemies[i].y, er, Math.max(er, H - er));
    }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
try {
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
  }
} catch(err){}
resize();

// Map client coordinates into game space. visualViewport scroll / CSS size can
// diverge from W×H; touch/mouse must not assume 1:1 with clientX/Y.
function pointerToGame(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  var rw = Math.max(1, rect.width);
  var rh = Math.max(1, rect.height);
  return {
    x: (clientX - rect.left) * (W / rw),
    y: (clientY - rect.top) * (H / rh)
  };
}

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a + (b-a)*t; }
function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function dist2(ax,ay,bx,by){ var dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; }
function len(x,y){ return Math.sqrt(x*x+y*y); }
function norm(x,y){ var l=Math.sqrt(x*x+y*y); return l>1e-6?{x:x/l,y:y/l}:{x:0,y:0}; }
function pad6(n){
  var s = String(n|0);
  while(s.length < 6) s = '0' + s;
  return s;
}

// Distance from a point to a line segment, kept squared so nothing takes a
// square root. This is the whole combat system: a dash is a segment and every
// enemy is a circle, so "did the blade connect" is one call to segCircle.
function segPointDist2(ax,ay,bx,by,px,py){
  var dx=bx-ax, dy=by-ay;
  var l2=dx*dx+dy*dy;
  if(l2 < 1e-9) return dist2(ax,ay,px,py);
  var t = ((px-ax)*dx + (py-ay)*dy) / l2;
  t = clamp(t,0,1);
  var cx=ax+t*dx, cy=ay+t*dy;
  return dist2(cx,cy,px,py);
}
function segCircle(ax,ay,bx,by,cx,cy,r){
  return segPointDist2(ax,ay,bx,by,cx,cy) <= r*r;
}

// Every sound is built from oscillators and filtered noise at the moment it
// plays. Browsers refuse to start an AudioContext until the user has actually
// touched something, so nothing here is created until the first key or click and
// every method no-ops harmlessly before then.
var SFX = {
  ac: null,
  master: null,
  noise: null,
  ready: false,
  muted: false,

  init: function(){
    if(this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try { this.ac = new AC(); } catch(e){ return; }
    this.master = this.ac.createGain();
    this.master.gain.value = 0.55;
    // A long combo can fire six or seven overlapping slices. Without the
    // compressor riding them down the sum clips into ugly digital crunch.
    var comp = null;
    try {
      comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 22;
      comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
      this.master.connect(comp); comp.connect(this.ac.destination);
    } catch(e){ this.master.connect(this.ac.destination); }

    // One noise buffer, filled once, shared by every burst. Generating a fresh
    // one per sound would allocate a couple of hundred KB mid-combat.
    var n = Math.floor(this.ac.sampleRate * 1.2);
    var b = this.ac.createBuffer(1, n, this.ac.sampleRate);
    var d = b.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    this.noise = b;
    this.ready = true;
  },

  resume: function(){
    this.init();
    if(this.ac && this.ac.state === 'suspended'){ this.ac.resume(); }
  },

  t: function(){ return this.ac ? this.ac.currentTime : 0; },

  // One pitched voice with an optional filter sweep. Note the 0.0001 floors on
  // every gain and the Math.max(1, ...) on every frequency: exponential ramps
  // throw if either endpoint is zero, so nothing is ever allowed to reach it.
  tone: function(o){
    if(!this.ready || this.muted) return;
    var ac=this.ac, t0=this.t() + (o.delay||0);
    var osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    var g = ac.createGain();
    var dur = o.dur || 0.2;
    var vol = (o.vol==null?0.2:o.vol);

    osc.frequency.setValueAtTime(o.f0, t0);
    if(o.f1 != null){
      if(o.exp === false) osc.frequency.linearRampToValueAtTime(Math.max(1,o.f1), t0+dur);
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+dur);
    }
    var atk = o.atk==null?0.004:o.atk;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);

    var node = osc;
    if(o.filter){
      var f = ac.createBiquadFilter();
      f.type = o.filter;
      f.frequency.setValueAtTime(o.fc0 || 1200, t0);
      if(o.fc1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.fc1), t0+dur);
      f.Q.value = o.q==null?1:o.q;
      node.connect(f); f.connect(g);
    } else {
      node.connect(g);
    }
    g.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  },

  // Noise shaped by a moving filter. Every impact, whoosh and rumble in the game
  // is this plus a tone or two stacked on top.
  burst: function(o){
    if(!this.ready || this.muted) return;
    var ac=this.ac, t0=this.t() + (o.delay||0);
    var src = ac.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = o.rate || 1;
    var f = ac.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.fc0 || 1000, t0);
    if(o.fc1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.fc1), t0+(o.dur||0.2));
    f.Q.value = o.q==null?1.1:o.q;
    var g = ac.createGain();
    var dur = o.dur || 0.2, vol = (o.vol==null?0.15:o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+(o.atk==null?0.006:o.atk));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    // Random offset into the buffer so repeated bursts don't sound like a loop.
    src.start(t0, Math.random()*0.4);
    src.stop(t0+dur+0.03);
  },

  dash: function(){
    this.burst({ filter:'bandpass', fc0:260, fc1:2600, q:0.8, dur:0.24, vol:0.22 });
    this.tone({ type:'sawtooth', f0:180, f1:70, dur:0.18, vol:0.10, filter:'lowpass', fc0:1400, fc1:300 });
  },

  // The slice climbs a semitone-ish per combo step, so a long chain walks up the
  // scale and you can hear how well you're doing without looking at the counter.
  // Capped at 14 or a monster run turns into an ear-splitting whistle.
  slice: function(combo){
    var c = clamp(combo,1,14);
    var base = 780 * Math.pow(1.055, c-1);
    this.tone({ type:'square',   f0:base,      f1:base*0.22, dur:0.085, vol:0.16, filter:'highpass', fc0:400 });
    this.tone({ type:'square',   f0:base*1.51, f1:base*0.35, dur:0.065, vol:0.09, filter:'highpass', fc0:600 });
    this.burst({ filter:'highpass', fc0:3400, fc1:7000, q:0.7, dur:0.09, vol:0.20 });
    this.tone({ type:'triangle', f0:base*0.5,  f1:base*0.16, dur:0.13, vol:0.10 });
  },

  comboUp: function(n){
    var f = 440 * Math.pow(1.1225, clamp(n,1,20));
    this.tone({ type:'triangle', f0:f, f1:f*1.5, dur:0.13, vol:0.13 });
    this.tone({ type:'sine',     f0:f*2, f1:f*3, dur:0.1,  vol:0.06, delay:0.02 });
    if(n >= 5){
      this.tone({ type:'sawtooth', f0:f*0.5, f1:f*2.2, dur:0.18, vol:0.08, filter:'lowpass', fc0:1800 });
    }
    if(n >= 8){
      this.burst({ filter:'bandpass', fc0:800, fc1:4200, q:0.6, dur:0.2, vol:0.14 });
    }
    if(n >= 12){
      this.tone({ type:'square', f0:f*0.25, f1:f*4, dur:0.22, vol:0.1, filter:'highpass', fc0:200 });
      this.burst({ filter:'highpass', fc0:2000, fc1:8000, q:0.5, dur:0.25, vol:0.16 });
    }
  },

  comboBreak: function(){
    this.tone({ type:'sawtooth', f0:220, f1:55, dur:0.28, vol:0.12, filter:'lowpass', fc0:900, fc1:180 });
    this.burst({ filter:'lowpass', fc0:600, fc1:120, q:0.7, dur:0.2, vol:0.1 });
  },

  // Metronome that runs while time is crawling. It's the audible cue that the
  // world is waiting on you rather than hung.
  tick: function(){
    this.tone({ type:'sine', f0:2050, f1:1750, dur:0.035, vol:0.035 });
  },

  shoot: function(){
    this.tone({ type:'sawtooth', f0:300, f1:130, dur:0.14, vol:0.07, filter:'lowpass', fc0:900, fc1:260 });
  },

  charge: function(){
    this.tone({ type:'sawtooth', f0:180, f1:520, dur:0.22, vol:0.05, filter:'lowpass', fc0:700, fc1:1600 });
  },

  phase: function(){
    this.tone({ type:'sine', f0:880, f1:440, dur:0.12, vol:0.04 });
    this.tone({ type:'triangle', f0:1320, f1:660, dur:0.1, vol:0.03, delay:0.02 });
  },

  nearMiss: function(){

// A bare object rather than {} so a key literally named "constructor" or
// "toString" can't collide with anything inherited.
var keys = Object.create(null);
var mouse = { down:false, right:false };
var rawMouse = { x: W*0.5, y: H*0.5 };
var aim = { x: W*0.5, y: H*0.5, angle: 0 };
var reticleSpread = 0;

// hasTouch tells us what to print on the title card; usingTouch tracks what the
// player last actually touched. A laptop with a touchscreen has the first but not
// necessarily the second, so aiming keeps following the mouse until a finger lands.
var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
var usingTouch = false;

var moveTouch = null;
var aimTouch  = null;

// Input is latched into these rather than acted on inside the handler, so a dash
// always resolves inside the update step where dt and positions are consistent.
var dashRequest = false;
var anyRequest  = false;

function firstInteraction(){ SFX.resume(); }

window.addEventListener('keydown', function(e){
  // Holding space would otherwise machine-gun dash requests at the OS repeat
  // rate. The preventDefault still has to happen or the page scrolls.
  if(e.repeat){
    if(e.code==='Space'||e.code.indexOf('Arrow')===0) e.preventDefault();
    return;
  }
  firstInteraction();
  keys[e.code] = true;
  if(e.code==='Space' || e.code.indexOf('Arrow')===0 || e.code==='Tab'){ e.preventDefault(); }
  if(e.code==='Space'){
    if(state === 'title'){ e.preventDefault(); startGame(); return; }
    if(state === 'over'){ e.preventDefault(); return; }
    dashRequest = true; anyRequest = true;
  }
  if(e.code==='Enter'){
    if(state === 'title') startGame();
    else if(state === 'over') startGame();
    else anyRequest = true;
  }
  // Escape exits browser fullscreen on CrazyGames — never bind it in-game.
  if(e.code==='Backspace' && state === 'over'){
    e.preventDefault(); goToMenu();
  }
  if(e.code==='KeyM'){
    if(CG.sdkMute) return; // CrazyGames mute wins over in-game toggle
    SFX.muted = !SFX.muted;
  }
  if(e.code==='KeyP' && state==='playing' && !CG.adOpen){
    paused = !paused;
    if(paused) cgGameplayStop();
    else cgGameplayStart();
  }
  if(e.code==='KeyX' && state==='playing' && tutorial.active){
    e.preventDefault(); skipTutorial();
  }
}, {passive:false});

window.addEventListener('keyup', function(e){ keys[e.code] = false; });

// Alt-tabbing mid-strafe never delivers the keyup, which would leave the game
// convinced you're still holding W: time stays at full speed and you drift into
// a wall while looking at another window. Wipe the whole set instead.
window.addEventListener('blur', function(){ keys = Object.create(null); });

canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('mousemove', function(e){
  usingTouch = false;
  var p = pointerToGame(e.clientX, e.clientY);
  rawMouse.x = p.x; rawMouse.y = p.y;
});

window.addEventListener('mousedown', function(e){
  firstInteraction();
  usingTouch = false;
  var p = pointerToGame(e.clientX, e.clientY);
  rawMouse.x = p.x; rawMouse.y = p.y;
  if(state === 'title'){
    if(e.button === 0){
      if(hitBtn(deployBtn, rawMouse.x, rawMouse.y)) startGame();
      else tryHitShop(rawMouse.x, rawMouse.y);
    }
    return;
  }
  if(state === 'over'){
    if(e.button === 0){
      if(hitBtn(againBtn, rawMouse.x, rawMouse.y)) startGame();
      else if(hitBtn(menuBtn, rawMouse.x, rawMouse.y)) goToMenu();
      else if(hitBtn(rewardBtn, rawMouse.x, rawMouse.y)) claimDoubleCoins();
      else if(hitBtn(reviveBtn, rawMouse.x, rawMouse.y)) claimRevive();
      else tryHitShop(rawMouse.x, rawMouse.y);
    }
    return;
  }
  if(e.button === 0 && tutorial.active && hitBtn(skipBtn, rawMouse.x, rawMouse.y)){
    skipTutorial();
    return;
  }
  if(e.button === 2){ mouse.right = true; dashRequest = true; e.preventDefault(); }
  else if(e.button === 0){ mouse.down = true; }
  anyRequest = true;
}, {passive:false});

window.addEventListener('mouseup', function(e){
  if(e.button === 2) mouse.right = false;
  if(e.button === 0) mouse.down = false;
});

// Touch splits the screen in two: a thumbstick that appears wherever the left
// hand lands, and a drag-and-release gesture on the right that flings the blade
// along the direction you dragged. Claiming the left zone at 45% rather than 50%
// biases the bigger half to aiming, which is the finicky half.
canvas.addEventListener('touchstart', function(e){
  firstInteraction();
  usingTouch = true;
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    var p = pointerToGame(t.clientX, t.clientY);
    if(state === 'title'){
      if(hitBtn(deployBtn, p.x, p.y)) startGame();
      else tryHitShop(p.x, p.y);
      e.preventDefault();
      return;
    }
    if(state === 'over'){
      if(hitBtn(againBtn, p.x, p.y)) startGame();
      else if(hitBtn(menuBtn, p.x, p.y)) goToMenu();
      else if(hitBtn(rewardBtn, p.x, p.y)) claimDoubleCoins();
      else if(hitBtn(reviveBtn, p.x, p.y)) claimRevive();
      else tryHitShop(p.x, p.y);
      e.preventDefault();
      return;
    }
    if(tutorial.active && hitBtn(skipBtn, p.x, p.y)){
      skipTutorial();
      e.preventDefault();
      return;
    }
    // Move stick must NOT write rawMouse — that was steering blink aim at the
    // MOVE pad whenever the left thumb was down (see mobile playtest frames).
    if(p.x < W*0.45 && !moveTouch){
      moveTouch = { id:t.identifier, ox:p.x, oy:p.y, x:p.x, y:p.y };
    } else if(!aimTouch){
      aimTouch = { id:t.identifier, sx:p.x, sy:p.y, x:p.x, y:p.y };
    }
  }
  e.preventDefault();
}, {passive:false});

canvas.addEventListener('touchmove', function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    var p = pointerToGame(t.clientX, t.clientY);
    if(moveTouch && t.identifier === moveTouch.id){ moveTouch.x = p.x; moveTouch.y = p.y; }
    if(aimTouch  && t.identifier === aimTouch.id ){ aimTouch.x  = p.x; aimTouch.y  = p.y; }
  }
  e.preventDefault();
}, {passive:false});

function endTouch(e){
  for(var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if(moveTouch && t.identifier === moveTouch.id){ moveTouch = null; }
    if(aimTouch && t.identifier === aimTouch.id){
      var dx = aimTouch.x - aimTouch.sx, dy = aimTouch.y - aimTouch.sy;
      var l = len(dx,dy);
      var dd = effectiveDashDist();
      // Drag: aim along flick direction in world space (never unit-vector aim.x/y —
      // that made the next updateAim point at the origin and break the dash).
      // Short tap: keep the last blink heading.
      if(l > 14){
        var n = norm(dx, dy);
        aim.angle = Math.atan2(n.y, n.x);
        aim.x = player.x + n.x * dd;
        aim.y = player.y + n.y * dd;
        rawMouse.x = aim.x;
        rawMouse.y = aim.y;
      }
      dashRequest = true;
      aimTouch = null;
    }
  }
  e.preventDefault();
}
canvas.addEventListener('touchend', endTouch, {passive:false});
canvas.addEventListener('touchcancel', endTouch, {passive:false});

// Returns a direction of length 0..1. Keyboard is always full tilt and gets
// normalised so diagonals aren't faster; the thumbstick is analogue, and its
// magnitude matters because a gentle lean should not wake time all the way up.
function moveVector(){
  var x = 0, y = 0;
  // WASD + AZERTY ZQSD + arrows — adapt to layout without a remap UI.
  if(keys['KeyA']||keys['KeyQ']||keys['ArrowLeft'])  x -= 1;
  if(keys['KeyD']||keys['ArrowRight']) x += 1;
  if(keys['KeyW']||keys['KeyZ']||keys['ArrowUp'])    y -= 1;
  if(keys['KeyS']||keys['ArrowDown'])  y += 1;
  if(x||y){ var n = norm(x,y); return n; }
  if(moveTouch){
    var dx = moveTouch.x - moveTouch.ox, dy = moveTouch.y - moveTouch.oy;
    var l = len(dx,dy);
    if(l > 8){
      var m = Math.min(1, l/58);
      return { x:(dx/l)*m, y:(dy/l)*m };
    }
  }
  return { x:0, y:0 };
}

var state = 'title';   // title | playing | over
var paused = false;

var player = null;
var enemies = [], projectiles = [], shards = [], trails = [], pops = [], floaters = [];
var coins = [];
var runCoins = 0;
var magnetT = 0;
var bankedCoins = 0;
var upgrades = { reach: 0, recovery: 0, magnet: 0 };
var goalBanner = 0;
var runCoinBanked = false;
var gameFinished = false;
var rewardClaimed = false; // 2× coins claimed this over screen
var reviveUsed = false;
var overSettled = false;   // coins locked in (1× or 2×)
var finishingFlow = false;

function saveBank(){
  storeSet(COINS_KEY, bankedCoins);
}
function saveUpgrades(){
  storeSet(UP_KEY, JSON.stringify(upgrades));
}
function dashDist(){ return DASH_DIST * (1 + upgrades.reach * 0.08); }
// On phones the playfield is often shorter than a full desktop dash. Cap the
// blink so the landing reticle stays on-screen and drag→angle math stays honest.
function effectiveDashDist(){
  var base = dashDist();
  var cap = Math.min(W, H) * 0.42;
  return Math.min(base, Math.max(140, cap));
}
function dashCd(){ return DASH_COOLDOWN * (1 - upgrades.recovery * 0.08); }
function magnetRadius(){ return MAGNET_R_BASE * (1 + upgrades.magnet * 0.28); }
function magnetDuration(){ return MAGNET_T_BASE * (1 + upgrades.magnet * 0.22); }
function upgradeCost(id){
  var lvl = upgrades[id]|0;
  if(lvl >= UPGRADE_MAX) return 0;
  return UPGRADE_COSTS[lvl];
}
function tryBuyUpgrade(id){
  if(!upgrades.hasOwnProperty(id)) return false;
  var lvl = upgrades[id]|0;
  if(lvl >= UPGRADE_MAX) return false;
  var cost = UPGRADE_COSTS[lvl];
  if(bankedCoins < cost) return false;
  bankedCoins -= cost;
  upgrades[id] = lvl + 1;
  saveBank();
  saveUpgrades();
  SFX.buy();
  return true;
}
function settleRunCoins(mult){
  if(overSettled || runCoinBanked) return 0;
  var m = mult == null ? 1 : mult;
  var gain = Math.floor(runCoins * m);
  bankedCoins += gain;
  runCoinBanked = true;
  overSettled = true;
  saveBank();
  return gain;
}
function claimDoubleCoins(){
  if(rewardClaimed || state !== 'over' || CG.adOpen) return;
  if(runCoins <= 0){
    floatText(W * 0.5, H * 0.4, 'NO COINS TO DOUBLE', COL.mute, 14);
    return;
  }
  if(!cgAdsOk()){
    floatText(W * 0.5, H * 0.4, 'ADS UNAVAILABLE', COL.mute, 14);
    return;
  }
  cgRewarded(function(){
    if(rewardClaimed || state !== 'over') return;
    rewardClaimed = true;
    // Run coins are already banked 1× on death; rewarded adds the second copy.
    var gain = Math.floor(runCoins);
    if(!runCoinBanked) gain = settleRunCoins(2);
    else {
      bankedCoins += gain;
      saveBank();
    }
    SFX.buy();
    floatText(W * 0.5, H * 0.36, '2×  +' + gain, COL.amber, 18);
  });
}
function claimRevive(){
  if(reviveUsed || state !== 'over' || CG.adOpen) return;
  if(!cgAdsOk()){
    floatText(W * 0.5, H * 0.4, 'ADS UNAVAILABLE', COL.mute, 14);
    return;
  }
  cgRewarded(function(){
    if(reviveUsed || state !== 'over') return;
    reviveUsed = true;
    revivePlayer();
  });
}
function revivePlayer(){
  state = 'playing';
  gameFinished = false;
  finishingFlow = false;
  rewardClaimed = false;
  deathT = 0;
  deathCause = '';
  deathTip = '';
  player.alive = true;
  player.dashing = false;
  player.cd = 0;
  player.invuln = 2.2;
  player.hits = 0;
  var clearR = 160;
  for(var i=enemies.length-1;i>=0;i--){
    if(dist2(enemies[i].x, enemies[i].y, player.x, player.y) < clearR*clearR) enemies.splice(i,1);
  }
  for(var j=projectiles.length-1;j>=0;j--){
    if(dist2(projectiles[j].x, projectiles[j].y, player.x, player.y) < clearR*clearR) projectiles.splice(j,1);
  }
  ring(player.x, player.y, COL.cyan, 10, 120, 0.4);
  floatText(player.x, player.y - 40, 'REVIVE', COL.cyan, 18);
  canvas.style.cursor = 'none';
  cgGameplayStart();
  SFX.start();
}
function claimRewardedCoins(){ claimDoubleCoins(); }
function tryHitShop(x, y){
  for(var i=0;i<shopBtns.length;i++){
    var b = shopBtns[i];

}
