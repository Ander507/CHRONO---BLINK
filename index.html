function tipForDeath(cause){
  if(cause === 'projectile') return 'Slice orbs mid-dash — they hang in slow-mo.';
  if(cause === 'gunner') return 'Close the gap before the amber charge completes.';
  if(cause === 'phantom') return 'Phantoms punish standing still. Keep blinking.';
  if(cause === 'stalker') return 'Stop to plan, then commit through the pack.';
  if(cause === 'whiff') return 'Empty dash = 1.2s lockout. Near-miss softens it.';
  return 'Time only flows when you move. Plan in the freeze.';
}

// Spawn beyond the edge so enemies walk into frame instead of popping into
// existence on top of the player.
function edgeSpawnPoint(){
  var m = 60;
  var side = randInt(0,3);
  if(side===0) return { x: rand(-m, W+m), y: -m };
  if(side===1) return { x: W+m,           y: rand(-m, H+m) };
  if(side===2) return { x: rand(-m, W+m), y: H+m };
  return           { x: -m,               y: rand(-m, H+m) };
}

function pickEnemyType(){
  var r = Math.random();
  if(wave <= 1)      return r < 0.88 ? 'stalker' : 'gunner';
  if(wave <= 2)      return r < 0.55 ? 'stalker' : (r < 0.88 ? 'gunner' : 'phantom');
  if(wave <= 4)      return r < 0.40 ? 'stalker' : (r < 0.72 ? 'gunner' : 'phantom');
  return               r < 0.30 ? 'stalker' : (r < 0.58 ? 'gunner' : 'phantom');
}

// Scripted opening compositions — pressure kinds, not just body count.
function waveComposition(w){
  if(w === 1) return ['stalker','stalker','stalker'];
  if(w === 2) return ['stalker','stalker','gunner','stalker'];
  if(w === 3) return ['stalker','gunner','phantom','stalker'];
  if(w === 4) return ['gunner','gunner','phantom','stalker','stalker'];
  if(w === 5) return ['phantom','phantom','gunner','stalker','gunner','stalker'];
  if(w === 6) return ['gunner','phantom','stalker','gunner','phantom','stalker','stalker'];
  var n = Math.min(10, 4 + Math.floor(w/2));
  var list = [];
  for(var i=0;i<n;i++) list.push(pickEnemyType());
  return list;
}

function spawnEnemy(type, sx, sy){
  if(!type) type = pickEnemyType();
  var d = ENEMY[type];
  var p = (sx != null && sy != null) ? { x:sx, y:sy } : edgeSpawnPoint();
  var sp = d.speed * (1 + (wave-1)*0.045);
  enemies.push({
    type: type, x: p.x, y: p.y, vx:0, vy:0,
    r: d.r, maxSpeed: sp, accel: d.accel, sides: d.sides,
    score: d.score, hp: d.hp,
    col: d.col, fill: d.fill, inner: d.inner,
    ang: rand(0, Math.PI*2), spin: rand(-1.6, 1.6),
    fire: type==='gunner' ? rand(1.1, 2.2) : 99,
    phase: rand(0, Math.PI*2),
    born: 0, orbit: Math.random() < 0.5 ? 1 : -1,
    telegraph: 0, charged: false
  });
  if(state === 'playing') SFX.spawn();
}

function seedTitleAmbient(){
  enemies.length = 0;
  projectiles.length = 0;
  var mix = ['stalker','stalker','gunner','phantom','stalker','gunner','phantom','stalker'];
  for(var i=0;i<mix.length;i++){
    var d = ENEMY[mix[i]];
    var ang = rand(0, Math.PI*2);
    var sp = d.speed * rand(0.7, 1.15);
    var band = rand(0, 4);
    var mx = Math.max(48, W * 0.16), my = Math.max(48, H * 0.16);
    var sx, sy;
    if(band < 1){ sx = rand(20, W-20); sy = rand(16, my); }
    else if(band < 2){ sx = rand(20, W-20); sy = rand(H-my, H-16); }
    else if(band < 3){ sx = rand(16, mx); sy = rand(20, H-20); }
    else { sx = rand(W-mx, W-16); sy = rand(20, H-20); }
    enemies.push({
      type: mix[i],
      x: sx, y: sy,
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      r: d.r, maxSpeed: sp, accel: d.accel, sides: d.sides,
      score: d.score, hp: d.hp,
      col: d.col, fill: d.fill, inner: d.inner,
      ang: rand(0, Math.PI*2), spin: rand(-1.1, 1.1),
      fire: 99, phase: rand(0, Math.PI*2),
      born: 1, orbit: Math.random() < 0.5 ? 1 : -1,
      telegraph: 0, charged: false
    });
  }
}

function updateTitleAmbient(dt){
  timeScale = TIME_IDLE;
  var wdt = dt * TIME_IDLE;
  if(!enemies.length) seedTitleAmbient();
  var cx = W * 0.5, cy = H * 0.5;
  var keep = Math.max(140, Math.min(W, H) * 0.34);
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    e.born = 1;
    e.ang += e.spin * wdt;
    e.phase += wdt * (e.type==='phantom' ? 11 : 3.2);
    var turn = Math.sin(titleT * 0.28 + i * 1.7) * 0.55;
    var c = Math.cos(turn * dt), s = Math.sin(turn * dt);
    var nvx = e.vx * c - e.vy * s;
    var nvy = e.vx * s + e.vy * c;
    e.vx = nvx; e.vy = nvy;
    var dx = e.x - cx, dy = e.y - cy;
    var d = len(dx, dy) || 1;
    if(d < keep){
      e.vx += (dx / d) * 90;
      e.vy += (dy / d) * 90;
    }
    var spd = len(e.vx, e.vy) || e.maxSpeed;
    if(spd > 1e-3){
      e.vx = (e.vx / spd) * e.maxSpeed;
      e.vy = (e.vy / spd) * e.maxSpeed;
    }
    e.x += e.vx * wdt;
    e.y += e.vy * wdt;
    var m = 48;
    if(e.x < -m) e.x = W + m;
    if(e.x > W + m) e.x = -m;
    if(e.y < -m) e.y = H + m;
    if(e.y > H + m) e.y = -m;
  }
}

function spawnProjectile(e){
  var d = norm(player.x - e.x, player.y - e.y);
  projectiles.push({
    x: e.x + d.x*e.r*1.4, y: e.y + d.y*e.r*1.4,
    vx: d.x*PROJ_SPEED, vy: d.y*PROJ_SPEED,
    r: PROJ_R, life: 8, phase: rand(0,6.28)
  });
  SFX.shoot();
}

// Break a dead thing into triangles flung outward from the point of death. The
// shards carry no gameplay meaning at all; they exist so a kill reads as violent
// rather than as an object quietly disappearing.
function shatter(x, y, sides, radius, tint){
  // Cap debris so long chains don't stack hundreds of glowing polys.
  if(shards.length > 90) shards.splice(0, shards.length - 70);
  var n = randInt(5, 8);
  for(var i=0;i<n;i++){
    var a = (i/n)*Math.PI*2 + rand(-0.3,0.3);
    var sp = rand(110, 300);
    shards.push({
      x: x + Math.cos(a)*rand(0,radius*0.5),
      y: y + Math.sin(a)*rand(0,radius*0.5),
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      size: rand(radius*0.22, radius*0.55),
      ang: rand(0,Math.PI*2), spin: rand(-9,9),
      life: rand(0.28,0.55), max: 0,
      col: tint || COL.red
    });
    shards[shards.length-1].max = shards[shards.length-1].life;
  }
}

function ring(x,y,col,r0,r1,life){
  pops.push({ x:x, y:y, r:r0, r1:r1, life:life, max:life, col:col });
}

function floatText(x,y,txt,col,size){
  floaters.push({ x:x, y:y, txt:txt, col:col, size:size||16, life:0.85, max:0.85, vy:-46 });
}

// Shake accumulates so a five-kill chain hits harder than five separate kills,
// but the ceilings matter: past roughly this much rotation the arena becomes
// genuinely unreadable and you die to something you never saw.
function addShake(mag, rot){
  shake.mag = Math.min(18, shake.mag + mag);
  shake.rot = Math.min(0.028, shake.rot + (rot||mag*0.00055));
}

function updateAim(dtReal){
  if(usingTouch){
    if(aimTouch){
      var dx = aimTouch.x - aimTouch.sx, dy = aimTouch.y - aimTouch.sy;
      if(len(dx,dy) > 8){
        var n = norm(dx,dy);
        var dd = effectiveDashDist();
        aim.x = player.x + n.x * dd;
        aim.y = player.y + n.y * dd;
        aim.angle = Math.atan2(n.y, n.x);
        rawMouse.x = aim.x;
        rawMouse.y = aim.y;
      }
    }
    // While only the move stick is down, leave aim.angle alone — do not chase
    // rawMouse (which used to sit under the MOVE thumb).
    reticleSpread += (0 - reticleSpread) * (1 - Math.exp(-15 * dtReal));
    return;
  }

  var smoothFactor = 1 - Math.exp(-22 * dtReal);
  aim.x += (rawMouse.x - aim.x) * smoothFactor;
  aim.y += (rawMouse.y - aim.y) * smoothFactor;
  aim.angle = Math.atan2(aim.y - player.y, aim.x - player.x);
  
  // Reticle spread calculation (expands when mouse moves relative to aim)
  var ddx = rawMouse.x - aim.x;
  var ddy = rawMouse.y - aim.y;
  var spreadTarget = Math.min(30, len(ddx, ddy) * 0.5);
  reticleSpread += (spreadTarget - reticleSpread) * (1 - Math.exp(-15 * dtReal));
}

function tryDash(){
  if(!player.alive || player.dashing || player.cd > 0) return;
  player.dashing = true;
  player.dashT = 0;
  player.hits = 0;
  player.nearMiss = false;
  player.sx = player.x; player.sy = player.y;
  var ddx = Math.cos(aim.angle);
  var ddy = Math.sin(aim.angle);
  var dd = usingTouch ? effectiveDashDist() : dashDist();
  var tx = player.x + ddx * dd;
  var ty = player.y + ddy * dd;
  // Clamping the destination rather than cancelling the dash means aiming into a
  // wall still gets you a shortened lunge that can still kill, instead of eating
  // your input and leaving you standing there.
  var pad = PLAYER_R + 4;
  player.ex = clamp(tx, pad, W - pad);
  player.ey = clamp(ty, pad, H - pad);
  player.invuln = DASH_TIME + DASH_GRACE;
  trails.push({
    x0: player.sx, y0: player.sy, x1: player.sx, y1: player.sy,
    life: 0.55, max: 0.55, live: true, w: 5
  });
  addShake(3, 0.004);
  SFX.dash();
}

function spawnCoins(x, y, type){
  var n = type === 'phantom' ? randInt(2, 3) : (type === 'gunner' ? randInt(1, 2) : 1);
  for(var i=0;i<n;i++){
    var a = rand(0, Math.PI*2);
    var sp = rand(40, 110);
    coins.push({
      x: x + Math.cos(a)*rand(4, 16),
      y: y + Math.sin(a)*rand(4, 16),
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      r: 5.5,
      life: 8,
      born: 0,
      value: 1
    });
  }
}

function collectCoin(c, idx){
  runCoins += c.value;
  floatText(c.x, c.y - 10, '+' + c.value, COL.amber, 13);
  SFX.coin();
  ring(c.x, c.y, COL.amber, 3, 22, 0.18);
  if(combo > 0){
    comboTimer = Math.min(
      comboTimer + 0.18,
      COMBO_TIME + Math.min(2.4, combo * 0.1)
    );
  }
  coins.splice(idx, 1);
}

function updateCoins(dt, wdt){
  if(magnetT > 0) magnetT = Math.max(0, magnetT - dt);
  var pull = magnetT > 0;
  var mr = magnetRadius();
  var mr2 = mr * mr;
  for(var i=coins.length-1;i>=0;i--){
    var c = coins[i];
    c.born += dt;
    c.life -= dt;
    if(c.life <= 0){ coins.splice(i,1); continue; }
    if(pull && player && player.alive){
      var ddx = player.x - c.x, ddy = player.y - c.y;
      var d2 = ddx*ddx + ddy*ddy;
      if(d2 < mr2 && d2 > 1){
        var d = Math.sqrt(d2);
        var str = (1 - d/mr) * 520;
        c.vx += (ddx/d) * str * dt;
        c.vy += (ddy/d) * str * dt;
      }
    }
    c.vx *= Math.pow(0.08, dt);
    c.vy *= Math.pow(0.08, dt);
    c.x += c.vx * Math.max(wdt, dt * 0.55);
    c.y += c.vy * Math.max(wdt, dt * 0.55);
    c.x = clamp(c.x, 10, W-10);
    c.y = clamp(c.y, 10, H-10);
    if(player && player.alive && dist2(c.x,c.y,player.x,player.y) < (c.r + PLAYER_R + 6)*(c.r + PLAYER_R + 6)){
      collectCoin(c, i);
    }
  }
}

function sliceSweep(ax, ay, bx, by){
  var hit = 0;
  for(var i=enemies.length-1;i>=0;i--){
    var e = enemies[i];
    if(segCircle(ax,ay,bx,by, e.x,e.y, e.r + SLICE_PAD)){
      var tint = e.col || COL.red;
      var etype = e.type;
      enemies.splice(i,1);
      shatter(e.x, e.y, e.sides, e.r, tint);
      ring(e.x, e.y, tint, e.r*0.7, e.r*4.2, 0.35);
      spawnCoins(e.x, e.y, etype);
      hit++;
      kills++;
      var gain = Math.round(e.score * Math.max(1, combo + hit));
      score += gain;
      floatText(e.x, e.y - e.r - 8, '+' + gain, COL.white, 15);
      SFX.slice(combo + hit);
      if(tutorial.active && tutorial.step === 1){
        tutorial.step = 2;
        tutorial.timer = 0;
        tutorial.prompt = 'KEEP CUTTING — DASH REFUNDS';
      }
    } else if(segCircle(ax,ay,bx,by, e.x,e.y, e.r + NEAR_MISS_PAD)){
      player.nearMiss = true;
    }
  }
  for(var j=projectiles.length-1;j>=0;j--){
    var p = projectiles[j];
    if(segCircle(ax,ay,bx,by, p.x,p.y, p.r + 9)){
      projectiles.splice(j,1);
      shatter(p.x, p.y, 3, p.r*1.5, COL.red);
      ring(p.x, p.y, COL.red, 2, p.r*3.2, 0.22);
      score += 25;
      SFX.pop();
    }
  }
  if(hit > 0){
    player.hits += hit;
    addShake(6 + hit*4, 0.006 + hit*0.003);
  }
  return hit;
}

function breakCombo(reason){
  if(combo <= 0){ combo = 0; comboTimer = 0; return; }
  var was = combo;
  combo = 0;
  comboTimer = 0;
  comboFlash = 0;
  comboPulse = 0;
  if(was >= 2){
    floatText(player.x, player.y - 36, 'COMBO BREAK', COL.red, 16);
    SFX.comboBreak();
    addShake(3 + was * 0.35, 0.003);
  }
}

function triggerComboFx(n, multiHit){
  comboFlash = 1;
  comboPulse = Math.min(1, 0.4 + Math.min(0.55, n * 0.04));
  // Prefer local rings + HUD punch over full-screen RGB split (that path is the lag).
  if(n >= 2 && n < 15){
    ring(player.x, player.y, COL.cyan, 8, 50 + Math.min(n, 14) * 6, 0.22);
    addShake(3 + Math.min(n, 12) * 0.25 + (multiHit ? 2 : 0), 0.003);
  }
  if(n >= 5 && n < 15){
    ring(player.x, player.y, COL.amber, 10, 90 + n * 6, 0.28);
    aber = Math.min(0.3, aber + 0.14);
  }
  if(n === 8){
    ring(player.x, player.y, COL.white, 8, 140, 0.32);
    invert = Math.min(0.28, invert + 0.16);
    floatText(player.x, player.y - 52, 'OVERDRIVE', COL.white, 18);
  }
  if(n === 12){
    ring(player.x, player.y, COL.amber, 6, 200, 0.34);
    floatText(player.x, player.y - 52, 'SINGULARITY', COL.amber, 18);
  }
  // Milestone bursts — rare enough to stay flashy without melting the framerate.
  if(n === 15){
    ring(player.x, player.y, COL.cyan, 10, 160, 0.4);
    ring(player.x, player.y, COL.amber, 20, 220, 0.35);
    floatText(player.x, player.y - 56, '15× RAMPAGE', COL.amber, 22);
    addShake(9, 0.012);
    aber = Math.min(0.4, aber + 0.22);
  }
  if(n === 25){
    ring(player.x, player.y, COL.white, 8, 200, 0.45);
    ring(player.x, player.y, COL.cyan, 18, 280, 0.4);
    ring(player.x, player.y, COL.violet, 28, 320, 0.32);
    floatText(player.x, player.y - 60, '25× CHRONO LOCK', COL.white, 24);
    addShake(11, 0.016);
    aber = Math.min(0.5, aber + 0.28);
    invert = Math.min(0.4, invert + 0.25);
    cgHappyTime();
  }
  if(n === 50){
    ring(player.x, player.y, COL.amber, 6, 240, 0.5);
    ring(player.x, player.y, COL.red, 14, 300, 0.42);
    ring(player.x, player.y, COL.cyan, 24, 360, 0.38);
    floatText(player.x, player.y - 64, '50× TIME FRACTURE', COL.amber, 26);
    addShake(13, 0.02);
    aber = Math.min(0.55, aber + 0.32);
    invert = Math.min(0.5, invert + 0.3);
    SFX.comboUp(20);
  }
  if(n === 100){
    ring(player.x, player.y, COL.white, 4, 280, 0.55);
    ring(player.x, player.y, COL.cyan, 12, 340, 0.5);
    ring(player.x, player.y, COL.amber, 22, 400, 0.45);
    ring(player.x, player.y, COL.red, 34, 460, 0.4);
    floatText(player.x, player.y - 70, '100× ETERNAL', COL.white, 28);
    addShake(16, 0.024);
    aber = Math.min(0.65, aber + 0.4);
    invert = Math.min(0.55, invert + 0.35);
    SFX.comboUp(24);
  }
}

function endDash(){
  player.dashing = false;
  for(var i=0;i<trails.length;i++){ if(trails[i].live) trails[i].live = false; }
  if(player.hits > 0){
    combo += 1;
    if(combo > bestCombo) bestCombo = combo;
    // Slightly longer leash at higher chains so big runs aren't brittle.
    comboTimer = COMBO_TIME + Math.min(2.4, combo * 0.1);
    player.cd = 0;
    player.chainWindow = CHAIN_WINDOW;
    magnetT = Math.max(magnetT, magnetDuration());
    SFX.comboUp(combo);
    triggerComboFx(combo, player.hits >= 2);
    if(combo >= 3 && combo !== 15 && combo !== 25 && combo !== 50 && combo !== 100){
      var cCol = combo >= 12 ? COL.amber : (combo >= 8 ? COL.white : (combo >= 5 ? COL.amber : COL.cyan));
      floatText(player.x, player.y - 34, combo + '×', cCol, 16 + Math.min(10, combo * 0.4));
    }
  } else if(player.nearMiss){
    // Near-miss: soft CD, but the chain still bleeds time instead of hard break.
    player.cd = dashCd() * 0.45;
    comboTimer = Math.max(0, comboTimer - 0.55);
    floatText(player.x, player.y - 28, 'NEAR MISS', COL.amber, 14);
    SFX.nearMiss();
    if(combo > 0 && comboTimer <= 0) breakCombo('near');
  } else {
    player.cd = (player.chainWindow > 0) ? dashCd() * 0.38 : dashCd();
    SFX.whiff();
    breakCombo('whiff');
  }
}

// There are two clocks in this function and keeping them straight is the whole
// trick. `dt` is real time and drives anything the player controls, so the
// character never feels sluggish no matter how frozen the world looks. `wdt` is
// dt scaled by timeScale and drives everything else. Holding a movement key winds
// the world back up to full speed, which is the bargain the game is built on:
// you cannot advance time without exposing yourself to it.
function update(dt){
  globalT += dt;

  // Fire queued blink before aim smoothing so a touch-release heading is not
  // overwritten on the same frame.
  if(dashRequest){ tryDash(); dashRequest = false; }
  updateAim(dt);

  // Holding right-click re-dashes the moment the blade comes back up. It reads as
  // a held attack and tryDash rejects the calls that arrive too early.
  if(mouse.right) tryDash();

  var mv = moveVector();
  var moving = (mv.x !== 0 || mv.y !== 0);

  var target = (moving || player.dashing) ? TIME_ACTIVE : TIME_IDLE;
  timeScale = lerp(timeScale, target, Math.min(1, dt * TIME_LERP));

  var wdt = dt * timeScale;
  elapsed += wdt;

  if(timeScale < 0.4 && player.alive){
    tickAcc += dt;
    if(tickAcc > 0.34){ tickAcc = 0; SFX.tick(); }
  } else tickAcc = 0;

  // Previous position is kept because the slice test needs the segment travelled,
  // not just where we ended up.
  player.px = player.x; player.py = player.y;

  if(player.dashing){
    // Real dt again: a dash lasts 115ms of wall-clock time regardless of how slow
    // the world is, which is why it feels like a snap rather than a glide.
    player.dashT += dt;
    var t = clamp(player.dashT / DASH_TIME, 0, 1);
    // Front-loaded easing. Most of the distance is covered in the first few
    // frames so the movement lands with a punch and settles, instead of coasting.
    var e2 = 1 - Math.pow(1 - t, 2.4);
    var nx = lerp(player.sx, player.ex, e2);
    var ny = lerp(player.sy, player.ey, e2);
    sliceSweep(player.px, player.py, nx, ny);
    player.x = nx; player.y = ny;
    for(var ti=0; ti<trails.length; ti++){
      if(trails[ti].live){ trails[ti].x1 = nx; trails[ti].y1 = ny; }
    }
    player.ang = Math.atan2(player.ey - player.sy, player.ex - player.sx);
    if(t >= 1) endDash();
  } else if(player.alive){
    player.x = clamp(player.x + mv.x * PLAYER_SPEED * dt, PLAYER_R, W - PLAYER_R);
    player.y = clamp(player.y + mv.y * PLAYER_SPEED * dt, PLAYER_R, H - PLAYER_R);
    player.ang = aim.angle;
  }
  player.spin += dt * (2.2 + timeScale*5);
  if(player.cd > 0) player.cd = Math.max(0, player.cd - dt);
  if(player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);
  if(comboFlash > 0) comboFlash = Math.max(0, comboFlash - dt * 2.8);
  if(comboPulse > 0) comboPulse = Math.max(0, comboPulse - dt * 1.4);
  if(player.chainWindow > 0) player.chainWindow = Math.max(0, player.chainWindow - dt);
  // Combo leash runs on real time — hanging in slow-mo still burns the clock.
  if(combo > 0){
    comboTimer -= dt;
    if(comboTimer <= 0) breakCombo('timeout');
  }
  // No sustained chromatic simmer — that kept the triple-canvas path running every frame.

  // Soft look-ahead toward aim so the arena feels directed, not locked to center.
  var lookAmt = player.dashing ? 28 : 16;
  cam.x = lerp(cam.x, Math.cos(aim.angle) * lookAmt, Math.min(1, dt * 6));
  cam.y = lerp(cam.y, Math.sin(aim.angle) * lookAmt, Math.min(1, dt * 6));

  // ---- Tutorial gate ----
  if(tutorial.active){
    tutorial.timer += dt;
    if(tutorial.step === 0){
      if(!moving && !player.dashing) tutorial.idleAcc += dt;
      else tutorial.idleAcc = Math.max(0, tutorial.idleAcc - dt * 2);
      if(tutorial.idleAcc > 0.7){
        tutorial.step = 1;
        tutorial.prompt = isTouchUI() ? 'DRAG & RELEASE — CUT THROUGH IT' : 'SPACE OR RMB — CUT THROUGH IT';
        tutorial.timer = 0;
      }
      // Keep exactly one tutor stalker alive and slow.
      if(enemies.length === 0) spawnEnemy('stalker', W*0.72, H*0.4);
    } else if(tutorial.step === 1){
      if(enemies.length === 0) spawnEnemy('stalker', W*0.7, H*0.42);
    } else if(tutorial.step === 2){
      if(tutorial.timer > 1.4) completeTutorial();
    }
    spawnTimer = 99;
  } else {
    var newWave = 1 + Math.floor(elapsed / WAVE_INTERVAL);
    if(newWave !== wave){
      wave = newWave;
      waveBanner = 1.35;
      SFX.wave();
      addShake(5, 0.004);
      var burst = waveComposition(wave);
      for(var b=0;b<burst.length;b++) spawnEnemy(burst[b]);
    }
    if(waveBanner > 0) waveBanner = Math.max(0, waveBanner - dt);

    var interval = Math.max(0.28, 1.05 - (wave-1)*0.11);
    var cap = Math.min(46, 7 + (wave-1)*3.4);
    // Sparse field = don't crawl. Mix in a little real-time so idle planning
    // doesn't leave the arena empty for ages between packs.
    var spawnDt = (enemies.length < 3) ? Math.max(wdt, dt * 0.55) : wdt;
    spawnTimer -= spawnDt;
    if(spawnTimer <= 0){
      spawnTimer = interval * rand(0.65, 1.05);
      if(enemies.length < 3) spawnTimer *= 0.55;
      if(enemies.length < cap) spawnEnemy();
    }
  }

  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    e.born += wdt;
    e.ang += e.spin * wdt;
    e.phase += wdt * (e.type==='phantom' ? 11 : 3.2);

    var dx = player.x - e.x, dy = player.y - e.y;
    var d = len(dx,dy) || 1;
    var ux = dx/d, uy = dy/d;
    var tvx = 0, tvy = 0;

    // Each type only decides on a *desired* velocity; the shared code below eases
    // actual velocity toward it. That's what gives them weight and makes them
    // overshoot when you sidestep, which is where the openings come from.
    if(e.type === 'stalker'){
      var stalkSp = tutorial.active ? e.maxSpeed * 0.45 : e.maxSpeed;
      tvx = ux * stalkSp; tvy = uy * stalkSp;
    } else if(e.type === 'gunner'){
      var want = 300;
      var radial = clamp((d - want) / 130, -1, 1);
      var tx2 = -uy * e.orbit, ty2 = ux * e.orbit;
      tvx = (ux * radial * 0.95 + tx2 * 0.65) * e.maxSpeed;
      tvy = (uy * radial * 0.95 + ty2 * 0.65) * e.maxSpeed;
      e.fire -= wdt;
      var ch = clamp(1 - e.fire/1.4, 0, 1);
      e.telegraph = ch;
      if(ch > 0.72 && !e.charged){
        e.charged = true;
        SFX.charge();
      }
      if(e.fire <= 0 && d < 900){
        e.fire = rand(1.5, 2.6) / (1 + (wave-1)*0.07);
        e.charged = false;
        e.telegraph = 0;
        spawnProjectile(e);
      }
    } else {
      var wob = Math.sin(e.born*4.4 + e.phase) * 0.75;
      var px2 = ux * Math.cos(wob) - uy * Math.sin(wob);
      var py2 = ux * Math.sin(wob) + uy * Math.cos(wob);
      var pulse = 0.72 + 0.55 * (0.5 + 0.5*Math.sin(e.born*7.5));
      // Telegraph peaks right before a phantom lunge.
      e.telegraph = clamp((pulse - 0.9) / 0.37, 0, 1);
      if(e.telegraph > 0.85 && !e.charged){
        e.charged = true;
        SFX.phase();
      }
      if(e.telegraph < 0.2) e.charged = false;
      tvx = px2 * e.maxSpeed * pulse; tvy = py2 * e.maxSpeed * pulse;
    }

    // Clamped because at very low frame rates accel*wdt can exceed 1, which would
    // overshoot the target velocity and oscillate.
    var k = Math.min(1, e.accel * wdt);
    e.vx = lerp(e.vx, tvx, k);
    e.vy = lerp(e.vy, tvy, k);
    e.x += e.vx * wdt;
    e.y += e.vy * wdt;

    // Shove overlapping enemies apart. Without this a dozen stalkers converge into
    // a single stack that looks like one enemy and dies to one dash: visually
    // confusing and far too generous. O(n^2), which is fine against the cap above.
    for(var j=i+1;j<enemies.length;j++){
      var o = enemies[j];
      var sdx = o.x - e.x, sdy = o.y - e.y;
      var sd2 = sdx*sdx + sdy*sdy;
      var minD = e.r + o.r + 6;
      if(sd2 > 0.01 && sd2 < minD*minD){
        var sd = Math.sqrt(sd2);
        var push = (minD - sd) * 0.5;
        var pnx = sdx/sd, pny = sdy/sd;
        e.x -= pnx*push; e.y -= pny*push;
        o.x += pnx*push; o.y += pny*push;
      }
    }

    // Keep combat on the playfield — no wandering into the letterbox.
    if(e.born > 0.55){
      var padE = e.r + 2;
      e.x = clamp(e.x, padE, Math.max(padE, W - padE));
      e.y = clamp(e.y, padE, Math.max(padE, H - padE));
    }

    // One touch kills. The invulnerability check is what makes dashing *through* a
    // crowd the intended move rather than suicide.
    if(player.alive && player.invuln <= 0 &&
       dist2(e.x,e.y,player.x,player.y) < (e.r + PLAYER_R)*(e.r + PLAYER_R)){
      killPlayer(e.type);
    }
  }

  // Orbs move on world time, so they hang in the air while you're still and only
  // become dangerous once you commit to moving. That's the mechanic in miniature.
  for(var p=projectiles.length-1;p>=0;p--){
    var pr = projectiles[p];
    pr.x += pr.vx * wdt;
    pr.y += pr.vy * wdt;
    pr.life -= wdt;
    pr.phase += wdt*6;
    if(pr.life <= 0 || pr.x < -60 || pr.x > W+60 || pr.y < -60 || pr.y > H+60){
      projectiles.splice(p,1); continue;
    }
    if(player.alive && player.invuln <= 0 &&
       dist2(pr.x,pr.y,player.x,player.y) < (pr.r + PLAYER_R)*(pr.r + PLAYER_R)){
      killPlayer('projectile');
    }
  }

  // Debris runs on its own clock, mostly real. On strict world time a kill made
  // while standing still would leave the shards hanging as a frozen cloud for ten
  // seconds; on pure real time they'd vanish before you noticed them. This splits
  // the difference so the explosion still reads as slow-motion but resolves.
  var sdt = dt * lerp(0.35, 1, timeScale);
  for(var s=shards.length-1;s>=0;s--){
    var sh = shards[s];
    sh.x += sh.vx * sdt; sh.y += sh.vy * sdt;
    sh.vx *= (1 - 2.1*sdt); sh.vy *= (1 - 2.1*sdt);
    sh.ang += sh.spin * sdt;
    sh.life -= sdt;
    if(sh.life <= 0) shards.splice(s,1);
  }

  // A live trail is still being stretched by the dash, so it doesn't age yet.
  for(var tr=trails.length-1;tr>=0;tr--){
    var T = trails[tr];
    if(!T.live){
      T.life -= dt;
      if(T.life <= 0) trails.splice(tr,1);
    }
  }

  // UI-ish flourishes age on real time. Slowing down feedback about what already
  // happened just makes the interface feel unresponsive.
  for(var q=pops.length-1;q>=0;q--){
    pops[q].life -= dt;
    if(pops[q].life <= 0) pops.splice(q,1);
  }
  for(var f=floaters.length-1;f>=0;f--){
    floaters[f].y += floaters[f].vy * dt;
    floaters[f].life -= dt;
    if(floaters[f].life <= 0) floaters.splice(f,1);
  }

  updateCoins(dt, wdt);
  if(goalBanner > 0) goalBanner = Math.max(0, goalBanner - dt);

  // pow(k, dt) rather than a flat multiply per frame, so the shake decays at the
  // same rate on a 144Hz monitor as on a 30fps laptop. The floors just snap tiny
  // residual values to zero so the render path can skip the transform entirely.
  shake.mag *= Math.pow(0.0016, dt);
  shake.rot *= Math.pow(0.0016, dt);
  if(shake.mag < 0.05) shake.mag = 0;
  if(shake.rot < 0.0002) shake.rot = 0;
  aber   = Math.max(0, aber   - dt * 4.2);
  invert = Math.max(0, invert - dt * 8.0);

  // Death holds for a beat before the summary appears. Cutting straight to the
  // stats screen swallows the explosion you just earned.
  if(!player.alive){
    deathT += dt;
    if(deathT > 0.9){ finishGame(); }
  }
}

// Guarded because on a bad frame several enemies and an orb can all reach you at
// once, and each would otherwise queue up its own explosion and rumble.
function killPlayer(cause){
  if(!player.alive) return;
  player.alive = false;
  player.dashing = false;
  deathCause = cause || 'unknown';
  deathTip = tipForDeath(deathCause);
  shatter(player.x, player.y, 4, 22, COL.cyan);
  shatter(player.x, player.y, 3, 15, COL.white);
  ring(player.x, player.y, COL.cyan, 8, 210, 0.7);
  ring(player.x, player.y, COL.red, 4, 150, 0.55);
  addShake(22, 0.03);
  aber = 0.55; invert = 0.4;
  SFX.fail();
}

function finishGame(){
  if(gameFinished) return;
  gameFinished = true;
  finishingFlow = false;
  rewardClaimed = false;
  overSettled = false;
  if(score > highScore && score > 0){
    highScore = score;
    storeSet(HS_KEY, highScore);
    cgHappyTime();
  }
  cgGameplayStop();
  state = 'over';
  anyRequest = false;
  dashRequest = false;
  moveTouch = null;
  aimTouch = null;
  // Bank 1× immediately so shop CREDITS matches the run; optional ad adds another copy.
  settleRunCoins(1);
}

// Neon is shadowBlur — expensive. Cap blur so long fights stay smooth.
function glow(g, col, blur){
  g.shadowColor = col;
  g.shadowBlur = Math.min(18, blur * 0.65);
}
function noGlow(g){
  g.shadowBlur = 0;
  g.shadowColor = 'transparent';
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 0;
}

// Every enemy, shard and the player itself is this one function at a different
// side count. The -PI/2 puts a vertex at the top so triangles point up.
function poly(g, x, y, r, sides, ang){
  g.beginPath();
  for(var i=0;i<sides;i++){
    var a = ang + (i/sides)*Math.PI*2 - Math.PI/2;
    var px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
  }
  g.closePath();
}

function roundPath(g, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w * 0.5, h * 0.5));
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function fillSpaced(g, text, cx, y, tracking){
  var n = text.length;
  if(!n) return;
  var total = 0, i;
  for(i=0;i<n;i++) total += g.measureText(text.charAt(i)).width;
  total += tracking * Math.max(0, n - 1);
  var x = cx - total * 0.5;
  var align = g.textAlign;
  g.textAlign = 'left';
  for(i=0;i<n;i++){
    var ch = text.charAt(i);
    g.fillText(ch, x, y);
    x += g.measureText(ch).width + tracking;
  }
  g.textAlign = align;
}

function strokeCorners(g, x, y, w, h, len){
  g.beginPath();
  g.moveTo(x, y + len); g.lineTo(x, y); g.lineTo(x + len, y);
  g.moveTo(x + w - len, y); g.lineTo(x + w, y); g.lineTo(x + w, y + len);
  g.moveTo(x + w, y + h - len); g.lineTo(x + w, y + h); g.lineTo(x + w - len, y + h);
  g.moveTo(x + len, y + h); g.lineTo(x, y + h); g.lineTo(x, y + h - len);
  g.stroke();
}

// The grid brightens as time slows, which is a second channel telling you the
// world is holding its breath. Both loops share one path and one stroke, since a
// stroke per line would be a few hundred draw calls for a background.
function drawGrid(g){
  // Warm floor wash + quiet rules — a room, not a HUD kit.
  g.save();
  var floor = g.createRadialGradient(W*0.5, H*0.55, 20, W*0.5, H*0.5, Math.max(W,H)*0.75);
  floor.addColorStop(0, 'rgba(42,38,52,0.55)');
  floor.addColorStop(0.55, 'rgba(20,19,26,0.2)');
  floor.addColorStop(1, 'rgba(8,8,12,0)');
  g.fillStyle = floor;
  g.fillRect(0,0,W,H);

  var step = 72;
  var a = 0.035 + timeScale * 0.04;
  g.lineWidth = 1;
  g.strokeStyle = COL.grid;
  g.globalAlpha = a;
  g.beginPath();
  var ox = (globalT * 4) % step;
  for(var x = -step + ox; x < W + step; x += step){
    g.moveTo(x, 0); g.lineTo(x, H);
  }
  for(var y = -step + ox; y < H + step; y += step){
    g.moveTo(0, y); g.lineTo(W, y);
  }
  g.stroke();
  g.restore();
}

function drawVignette(g){
  var r = Math.max(W,H)*0.85;
  var grd = g.createRadialGradient(W/2,H/2, r*0.4, W/2,H/2, r);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, 'rgba(8,7,12,0.55)');
  g.fillStyle = grd;
  g.fillRect(0,0,W,H);
}

// Edge wash while a chain is hot — single gradient, no second core pass.
function drawComboHeat(g){
  if(state !== 'playing' || combo < 3) return;
  var heat = Math.min(1, (combo - 2) * 0.06 + comboPulse * 0.7 + comboFlash * 0.35);
  if(heat < 0.08) return;
  var fuseWarn = comboTimer < 0.7;
  var rgb = fuseWarn ? '232,69,60'
    : (combo >= 8 ? '242,236,228' : (combo >= 5 ? '232,184,109' : '125,232,214'));
  var edge = g.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.72);
  edge.addColorStop(0, 'rgba(' + rgb + ',0)');
  edge.addColorStop(1, 'rgba(' + rgb + ',' + (0.05 + heat * 0.14).toFixed(3) + ')');
  g.fillStyle = edge;
  g.fillRect(0,0,W,H);
}

function drawTrails(g){
  g.save();
  g.lineCap = 'round';
  for(var i=0;i<trails.length;i++){
    var T = trails[i];
    var k = T.live ? 1 : (T.life / T.max);
    var a = Math.pow(k, 0.85);
    glow(g, COL.cyan, 14*a + 4);
    g.strokeStyle = 'rgba(125,232,214,' + (0.85*a).toFixed(3) + ')';
    g.lineWidth = T.w * (0.35 + 0.65*a);
    g.beginPath(); g.moveTo(T.x0,T.y0); g.lineTo(T.x1,T.y1); g.stroke();
    // A thin near-white line inside the glowing one. Two passes is what sells it
    // as something incandescent rather than a blurry cyan stripe.
    noGlow(g);
    g.strokeStyle = 'rgba(230,255,255,' + (0.7*a).toFixed(3) + ')';
    g.lineWidth = Math.max(0.6, T.w*0.28*a);
    g.beginPath(); g.moveTo(T.x0,T.y0); g.lineTo(T.x1,T.y1); g.stroke();
  }
  g.restore();
}

function drawShards(g){
  g.save();
  for(var i=0;i<shards.length;i++){
    var s = shards[i];
    var a = clamp(s.life / s.max, 0, 1);
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.ang);
    g.globalAlpha = a;
    glow(g, s.col, 6*a);
    g.strokeStyle = s.col;
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(0, -s.size);
    g.lineTo(s.size*0.85, s.size*0.7);
    g.lineTo(-s.size*0.85, s.size*0.7);
    g.closePath();
    g.stroke();
    g.restore();
  }
  g.restore();
  noGlow(g);
}

function drawDust(g){
  g.save();
  g.fillStyle = 'rgba(125,232,214,0.35)';
  var cx = W * 0.5, cy = H * 0.5;
  var vx = 0, vy = 0;
  if(player && player.alive){
    vx = (player.x - player.px);
    vy = (player.y - player.py);
  }
  for(var i = 0; i < dust.length; i++) {
    var d = dust[i];
    d.x -= vx * d.z * 0.5;
    d.y -= vy * d.z * 0.5;
    d.x += (Math.cos(globalT * 0.4 + i) * 1.5) * d.z;
    d.y += (Math.sin(globalT * 0.4 + i) * 1.5) * d.z;
    if(d.x < 0) d.x += W;
    if(d.x > W) d.x -= W;
    if(d.y < 0) d.y += H;
    if(d.y > H) d.y -= H;
    var px = (d.x - cx) * d.z + cx;
    var py = (d.y - cy) * d.z + cy;
    g.fillRect(px, py, d.size, d.size);
  }
  g.restore();
}

function drawRings(g){
  g.save();
  for(var i=0;i<pops.length;i++){
    var p = pops[i];
    var t = 1 - (p.life / p.max);
    var r = lerp(p.r, p.r1, 1 - Math.pow(1-t, 2));
    var a = 1 - t;
    g.globalAlpha = a * 0.8;
    glow(g, p.col, 16*a);
    g.strokeStyle = p.col;
    g.lineWidth = Math.max(0.8, 3*a);
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI*2); g.stroke();
  }
  g.restore();
  noGlow(g);
}

function drawProjectiles(g){
  g.save();
  for(var i=0;i<projectiles.length;i++){
    var p = projectiles[i];
    var pu = 0.85 + 0.15*Math.sin(p.phase);
    var ang = Math.atan2(p.vy, p.vx);
    var r = p.r * pu;
    // Hostile bolts: coral diamond + motion streak — not gold discs.
    g.save();
    g.translate(p.x, p.y);
    g.rotate(ang);
    glow(g, COL.red, 14);
    g.fillStyle = 'rgba(232,69,60,0.28)';
    g.beginPath();
    g.moveTo(r * 1.9, 0);
    g.lineTo(0, r * 0.85);
    g.lineTo(-r * 1.15, 0);
    g.lineTo(0, -r * 0.85);
    g.closePath();
    g.fill();
    g.strokeStyle = COL.red;
    g.lineWidth = 2;
    g.stroke();
    noGlow(g);
    g.fillStyle = 'rgba(242,236,228,0.92)';
    g.beginPath();
    g.moveTo(r * 0.85, 0);
    g.lineTo(0, r * 0.35);
    g.lineTo(-r * 0.35, 0);
    g.lineTo(0, -r * 0.35);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(232,69,60,0.55)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(-r * 1.2, 0);
    g.lineTo(-r * 2.6, 0);
    g.stroke();
    g.restore();
  }
  g.restore();
  noGlow(g);
}

function drawEnemies(g){
  g.save();
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    var spawnFade = clamp(e.born/0.35, 0, 1);
    if(state === 'title') spawnFade *= 0.55;
    var r = e.r;
    if(e.type === 'phantom') r = e.r * (0.82 + 0.3*(0.5+0.5*Math.sin(e.phase)));
    var col = e.col || COL.red;
    g.globalAlpha = spawnFade;

    glow(g, col, e.type==='phantom' ? 14 : 10);
    g.strokeStyle = col;
    g.lineWidth = 2.2;
    poly(g, e.x, e.y, r, e.sides, e.ang);
    g.stroke();

    noGlow(g);
    g.fillStyle = e.fill || 'rgba(255,0,85,0.13)';
    poly(g, e.x, e.y, r*0.96, e.sides, e.ang);
    g.fill();

    g.strokeStyle = e.inner || 'rgba(255,120,160,0.75)';
    g.lineWidth = 1;
    poly(g, e.x, e.y, r*0.44, e.sides, -e.ang*1.5);
    g.stroke();

    if(e.type === 'gunner'){
      var ch = e.telegraph || clamp(1 - e.fire/1.4, 0, 1);
      if(ch > 0.05){
        glow(g, COL.amber, 14*ch);
        g.strokeStyle = 'rgba(255,204,51,' + (0.55 + 0.4*ch).toFixed(2) + ')';
        g.lineWidth = 1.5 + ch;
        g.beginPath();
        g.arc(e.x, e.y, r*1.55, -Math.PI/2, -Math.PI/2 + ch*Math.PI*2);
        g.stroke();
        // Aim telegraph line toward player when nearly charged.
        if(ch > 0.45 && player && player.alive){
          var ad = norm(player.x - e.x, player.y - e.y);
          g.globalAlpha = spawnFade * Math.min(1, ch * 1.15);
          g.setLineDash([5, 5]);
          g.strokeStyle = 'rgba(232,184,109,' + (0.4 + 0.5*ch).toFixed(2) + ')';
          g.lineWidth = 1.8 + ch;
          g.beginPath();
          g.moveTo(e.x + ad.x*r*1.2, e.y + ad.y*r*1.2);
          g.lineTo(e.x + ad.x*r*7.2, e.y + ad.y*r*7.2);
          g.stroke();
          g.setLineDash([]);
          g.globalAlpha = spawnFade;
        }
        noGlow(g);
      }
    }
    if(e.type === 'phantom' && e.telegraph > 0.12){
      glow(g, COL.violet, 22*e.telegraph);
      g.strokeStyle = 'rgba(180,77,255,' + (0.42 + 0.55*e.telegraph).toFixed(2) + ')';
      g.lineWidth = 1.6 + e.telegraph;
      g.beginPath();
      g.arc(e.x, e.y, r*(1.9 + e.telegraph*1.1), 0, Math.PI*2);
      g.stroke();
      if(e.telegraph > 0.55 && player && player.alive){
        var pd = norm(player.x - e.x, player.y - e.y);
        g.globalAlpha = spawnFade * e.telegraph;
        g.setLineDash([3, 5]);
        g.beginPath();
        g.moveTo(e.x, e.y);
        g.lineTo(e.x + pd.x*r*5, e.y + pd.y*r*5);
        g.stroke();
        g.setLineDash([]);
        g.globalAlpha = spawnFade;
      }
      noGlow(g);
    }
    if(e.type === 'stalker'){
      var hv = norm(e.vx, e.vy);
      if(hv.x || hv.y){
        g.strokeStyle = 'rgba(255,0,85,0.55)';
        g.lineWidth = 1.2;
        g.beginPath();
        g.moveTo(e.x, e.y);
        g.lineTo(e.x + hv.x*r*2.4, e.y + hv.y*r*2.4);
        g.stroke();
      }
    }
  }
  g.restore();
  noGlow(g);
}

function drawPlayer(g){
  if(!player.alive) return;
  var r = PLAYER_R;
  g.save();

  // Ring around the player winds back up as the dash recharges, so cooldown lives
  // where your eyes already are instead of only in the corner readout.
  var ready = player.cd <= 0;
  var cdk = ready ? 1 : (1 - player.cd / dashCd());
  g.globalAlpha = 1;
  glow(g, ready ? COL.cyan : COL.cyanD, ready ? 14 : 6);
  g.strokeStyle = ready ? 'rgba(0,243,255,0.75)' : 'rgba(0,243,255,0.30)';
  g.lineWidth = ready ? 2 : 3;
  g.beginPath();
  g.arc(player.x, player.y, r + 9, -Math.PI/2, -Math.PI/2 + cdk*Math.PI*2);
  g.stroke();

  // Dashed line plus a reticle at the exact landing spot. Committing 240px blind
  // is miserable, and showing the destination is what turns the dash from a gamble
  // into a plan.
  noGlow(g);
  g.strokeStyle = 'rgba(0,243,255,0.20)';
  g.lineWidth = 1;
  g.setLineDash([6,9]);
  g.beginPath();
  var ddx = Math.cos(aim.angle), ddy = Math.sin(aim.angle);
  var dd = usingTouch ? effectiveDashDist() : dashDist();
  g.moveTo(player.x + ddx*(r+14), player.y + ddy*(r+14));
  g.lineTo(player.x + ddx*(r+14+dd*0.86), player.y + ddy*(r+14+dd*0.86));
  g.stroke();
  g.setLineDash([]);
  
  var lx = clamp(player.x + ddx*dd, r, W-r);
  var ly = clamp(player.y + ddy*dd, r, H-r);
  g.strokeStyle = 'rgba(0,243,255,0.35)';
  g.beginPath(); g.arc(lx, ly, 7, 0, Math.PI*2); g.stroke();
  g.beginPath(); g.moveTo(lx-11,ly); g.lineTo(lx-4,ly); g.moveTo(lx+4,ly); g.lineTo(lx+11,ly); g.stroke();

  // Custom Neon Reticle at aim coordinates
  if(!usingTouch){
    g.save();
    g.translate(aim.x, aim.y);
    g.rotate(aim.angle);
    glow(g, COL.cyan, 12);
    g.strokeStyle = COL.cyan;
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(-4, 0); g.lineTo(4, 0);
    g.moveTo(0, -4); g.lineTo(0, 4);
    g.stroke();
    
    var sp = 10 + reticleSpread;
    var len = 4;
    g.strokeStyle = 'rgba(0,243,255,0.6)';
    g.lineWidth = 1;
    g.beginPath();
    // top right
    g.moveTo(sp, sp - len); g.lineTo(sp, sp); g.lineTo(sp - len, sp);
    // bottom right
    g.moveTo(sp, -sp + len); g.lineTo(sp, -sp); g.lineTo(sp - len, -sp);
    // top left
    g.moveTo(-sp, sp - len); g.lineTo(-sp, sp); g.lineTo(-sp + len, sp);
    // bottom left
    g.moveTo(-sp, -sp + len); g.lineTo(-sp, -sp); g.lineTo(-sp + len, -sp);
    g.stroke();
    g.restore();
    noGlow(g);
  }

  // Brighter mid-dash, which is the cheapest possible way to signal invulnerability.
  glow(g, COL.cyan, player.dashing ? 18 : 12);
  g.strokeStyle = COL.cyan;
  g.lineWidth = 2.4;
  poly(g, player.x, player.y, r, 4, player.spin*0.6);
  g.stroke();
  g.fillStyle = 'rgba(0,243,255,0.18)';
  poly(g, player.x, player.y, r*0.95, 4, player.spin*0.6);
  g.fill();

  g.strokeStyle = COL.white;
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(player.x + ddx*r*0.4, player.y + ddy*r*0.4);
  g.lineTo(player.x + ddx*(r+9), player.y + ddy*(r+9));
  g.stroke();

  noGlow(g);
  g.fillStyle = COL.white;
  g.beginPath(); g.arc(player.x, player.y, 2.4, 0, Math.PI*2); g.fill();

  // Shows the grace window after landing, so surviving a hair-thin escape looks
  // deliberate rather than like the hit detection failed.
  if(player.invuln > 0 && !player.dashing){
    g.strokeStyle = 'rgba(234,246,255,0.35)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(player.x, player.y, r + 4, 0, Math.PI*2); g.stroke();
  }
  g.restore();
  noGlow(g);
}

function drawFloaters(g){
  g.save();
  g.textAlign = 'center';
  for(var i=0;i<floaters.length;i++){
    var f = floaters[i];
    var a = clamp(f.life/f.max, 0, 1);
    g.globalAlpha = a;
    g.font = '800 ' + Math.max(14, f.size) + 'px system-ui, -apple-system, sans-serif';
    glow(g, f.col, 10*a);
    g.fillStyle = f.col;
    g.fillText(f.txt, f.x, f.y);
  }
  g.restore();
  noGlow(g);
}

function drawTouchUI(g){
  if(!isTouchUI() || state !== 'playing') return;
  g.save();
  // Ghost pads so first-time mobile players see the split layout.
  if(!moveTouch){
    g.globalAlpha = 0.18;
    g.strokeStyle = COL.cyan;
    g.lineWidth = 2;
    g.beginPath(); g.arc(56, H - 72, 40, 0, Math.PI*2); g.stroke();
    mono(g, 10, '600');
    g.fillStyle = COL.cyan;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('MOVE', 56, H - 72);
    g.globalAlpha = 1;
  }
  if(!aimTouch){
    g.globalAlpha = 0.18;
    g.strokeStyle = COL.amber;
    g.lineWidth = 2;
    g.beginPath(); g.arc(W - 56, H - 72, 40, 0, Math.PI*2); g.stroke();
    mono(g, 10, '600');
    g.fillStyle = COL.amber;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('BLINK', W - 56, H - 72);
    g.globalAlpha = 1;
  }
  if(moveTouch){
    g.strokeStyle = 'rgba(125,232,214,0.35)';
    g.lineWidth = 2;
    g.beginPath(); g.arc(moveTouch.ox, moveTouch.oy, 58, 0, Math.PI*2); g.stroke();
    var dx = moveTouch.x-moveTouch.ox, dy = moveTouch.y-moveTouch.oy;
    var l = len(dx,dy); var m = Math.min(1, l/58);
    var kx = moveTouch.ox + (l>0?dx/l:0)*58*m, ky = moveTouch.oy + (l>0?dy/l:0)*58*m;
    glow(g, COL.cyan, 10);
    g.fillStyle = 'rgba(125,232,214,0.55)';
    g.beginPath(); g.arc(kx, ky, 20, 0, Math.PI*2); g.fill();
    noGlow(g);
  }
  if(aimTouch){
    g.strokeStyle = 'rgba(232,184,109,0.55)';
    g.lineWidth = 2;
    g.setLineDash([8,8]);
    g.beginPath(); g.moveTo(aimTouch.sx, aimTouch.sy); g.lineTo(aimTouch.x, aimTouch.y); g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.arc(aimTouch.sx, aimTouch.sy, 12, 0, Math.PI*2); g.stroke();
  }
  g.restore();
}

function uiScaleNow(){
  return Math.max(1, Math.min(W, H) / 800);
}
function mono(g, size, weight){
  var px = Math.max(10, Math.round(size));
  g.font = (weight||'600') + ' ' + px + 'px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
}
function uiFont(g, size, weight){
  var px = Math.max(14, Math.round(size));
  g.font = (weight || '700') + ' ' + px + 'px "IBM Plex Sans", "Segoe UI", sans-serif';
}
function displayFont(g, size, weight){
  var px = Math.max(16, Math.round(size));
  g.font = (weight || '800') + ' ' + px + 'px Syne, "Arial Black", "Segoe UI", sans-serif';
}
function ink(g){
  g.shadowColor = 'rgba(0,0,0,0.8)';
  g.shadowBlur = 8;
  g.shadowOffsetX = 0;
  g.shadowOffsetY = 1;
}
function drawAngledPanel(g, x, y, w, h, cut){
  g.beginPath();
  g.moveTo(x + cut, y);
  g.lineTo(x + w, y);
  g.lineTo(x + w, y + h - cut);
  g.lineTo(x + w - cut, y + h);
  g.lineTo(x, y + h);
  g.lineTo(x, y + cut);
  g.closePath();
}

function fillPanel(g, x, y, w, h, r, border){
  noGlow(g);
  drawAngledPanel(g, x, y, w, h, r);
  g.fillStyle = 'rgba(5, 5, 10, 0.75)';
  g.fill();
  g.strokeStyle = border || 'rgba(0,243,255,0.85)';
  g.lineWidth = 1;
  g.stroke();
}

function drawKeyBadge(g, x, y, label, S){
  var fs = Math.max(14, Math.round(13 * S));
  var padX = 10 * S, padY = 6 * S;
  uiFont(g, fs, '800');
  var tw = g.measureText(label).width;
  var w = Math.max(tw + padX * 2, 32 * S);
  var h = fs + padY * 2;
  noGlow(g);
  drawAngledPanel(g, x, y, w, h, 4 * S);
  g.fillStyle = 'rgba(5,5,10,0.85)';
  g.fill();
  g.strokeStyle = 'rgba(0,243,255,0.9)';
  g.lineWidth = Math.max(1, 1.2 * S);
  g.stroke();
  ink(g);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = COL.white;
  g.fillText(label, x + w * 0.5, y + h * 0.5 + 0.5);
  noGlow(g);
  return { w:w, h:h };
}

function drawWireCard(g, x, y, w, h, S){
  noGlow(g);
  drawAngledPanel(g, x, y, w, h, 10 * S);
  g.fillStyle = 'rgba(5, 5, 10, 0.82)';
  g.fill();
  g.strokeStyle = 'rgba(0,243,255,0.55)';
  g.lineWidth = Math.max(1, 1.2 * S);
  g.stroke();
  g.strokeStyle = 'rgba(0,243,255,0.9)';
  g.lineWidth = Math.max(1.4, 1.6 * S);
  strokeCorners(g, x, y, w, h, 16 * S);
}

function isTouchUI(){
  if(usingTouch) return true;
  try {
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
  } catch(err){}
  return false;
}

function drawTitleCard(g, x, y, w, h, S, title, lines){
  drawWireCard(g, x, y, w, h, S);
  var pad = Math.max(16, 20 * S);
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  uiFont(g, Math.max(14, 15 * S), '900');
  ink(g);
  g.fillStyle = COL.cyan;
  g.fillText(title, x + pad, y + pad + 14 * S);
  noGlow(g);
  var ly = y + pad + 38 * S;
  var i;
  for(i=0;i<lines.length;i++){
    var row = lines[i];
    uiFont(g, Math.max(14, 15 * S), '700');
    ink(g);
    g.fillStyle = row.hi ? COL.white : 'rgba(234,246,255,0.88)';
    g.fillText(row.t, x + pad, ly);
    noGlow(g);
    ly += 26 * S;
  }
}

function drawCTA(g, cx, y, label, S, pulse, hovered){
  uiFont(g, Math.max(16, 18 * S), '900');
  var tw = g.measureText(label).width;
  var btnW = (deployBtn.w > 1) ? deployBtn.w : Math.max(tw + 48 * S, Math.min(W - 40 * S, 420 * S));
  var btnH = (deployBtn.h > 1) ? deployBtn.h : Math.max(48, 52 * S);
  deployBtn.x = cx - btnW * 0.5;
  deployBtn.y = y;
  deployBtn.w = btnW;
  deployBtn.h = btnH;
  drawAngledPanel(g, deployBtn.x, deployBtn.y, deployBtn.w, deployBtn.h, 10 * S);
  // Solid fill so the CTA reads as the one interactive action, not another wireframe card.
  g.fillStyle = hovered ? 'rgba(0,243,255,0.32)' : 'rgba(0,243,255,0.16)';
  g.fill();
  glow(g, COL.cyan, hovered ? 32 : (14 + pulse * 18));
  g.strokeStyle = COL.cyan;
  g.globalAlpha = hovered ? 1 : (0.65 + 0.35 * pulse);
  g.lineWidth = hovered ? 2.8 * S : 2.2 * S;
  g.stroke();
  g.globalAlpha = 1;
  noGlow(g);
  g.strokeStyle = 'rgba(234,246,255,0.85)';
  g.lineWidth = Math.max(1.3, 1.5 * S);
  strokeCorners(g, deployBtn.x, deployBtn.y, deployBtn.w, deployBtn.h, 14 * S);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  uiFont(g, Math.max(16, 18 * S), '900');
  ink(g);
  glow(g, COL.cyan, hovered ? 16 : 8);
  g.fillStyle = COL.white;
  g.fillText(label, cx, y + btnH * 0.5 + 0.5);
  noGlow(g);
}

function drawHUD(g){
  g.save();
  var S = Math.max(1, Math.min(W, H) / 800);
  var narrow = W < 720;
  var pad = (narrow ? 14 : 20) * S;

  // Plain type — no chrome boxes. Shadow keeps it readable on the playfield.
  g.textAlign = 'left';
  g.textBaseline = 'top';
  mono(g, Math.max(11, 11 * S), '600');
  g.fillStyle = COL.mute;
  g.fillText('SCORE', pad, pad);
  displayFont(g, Math.max(26, (narrow ? 28 : 34) * S), '800');
  g.fillStyle = COL.white;
  g.shadowColor = 'rgba(0,0,0,0.75)';
  g.shadowBlur = 6;
  g.fillText(pad6(score), pad, pad + 14 * S);
  noGlow(g);
  mono(g, Math.max(11, 11 * S), '600');
  g.fillStyle = COL.cyan;
  g.fillText('best  ' + pad6(highScore), pad, pad + 14 * S + Math.max(26, (narrow ? 28 : 34) * S) + 4 * S);
  mono(g, Math.max(11, 11 * S), '600');
  g.fillStyle = COL.amber;
  g.fillText('coins  ' + runCoins, pad, pad + 14 * S + Math.max(26, (narrow ? 28 : 34) * S) + 20 * S);

  g.textAlign = 'right';
  displayFont(g, Math.max(18, (narrow ? 18 : 22) * S), '800');
  g.fillStyle = COL.red;
  g.shadowColor = 'rgba(0,0,0,0.75)';
  g.shadowBlur = 6;
  g.fillText('WAVE ' + wave, W - pad, pad);
  noGlow(g);
  mono(g, Math.max(11, 11 * S), '600');
  g.fillStyle = COL.mute;
  g.fillText(elapsed.toFixed(1) + 's', W - pad, pad + Math.max(18, (narrow ? 18 : 22) * S) + 4 * S);
  if(SFX.muted){
    g.fillStyle = COL.amber;
    g.fillText('MUTED', W - pad, pad + Math.max(18, (narrow ? 18 : 22) * S) + 20 * S);
  }

  var topBlock = pad + Math.max(68, 76 * S);
  if(combo >= 2){
    var cfs = Math.max(narrow ? 22 : 26, Math.round((narrow ? 24 : 30) * S));
    var hot = combo >= 100 ? COL.white
      : (combo >= 50 ? COL.amber
      : (combo >= 25 ? COL.white
      : (combo >= 15 ? COL.amber
      : (combo >= 8 ? COL.white : (combo >= 5 ? COL.amber : COL.cyan)))));
    var maxT = COMBO_TIME + Math.min(1.2, combo * 0.08);
    var fuse = clamp(comboTimer / maxT, 0, 1);
    if(fuse < 0.28) hot = COL.red;
    var pop = 1 + comboFlash * 0.18 + comboPulse * 0.06;
    g.save();
    g.translate(W * 0.5, topBlock);
    g.scale(pop, pop);
    g.textAlign = 'center';
    g.textBaseline = 'top';
    displayFont(g, cfs, '800');
    g.fillStyle = hot;
    g.shadowColor = 'rgba(0,0,0,0.7)';
    g.shadowBlur = 5;
    g.globalAlpha = 0.82 + 0.18 * comboFlash;
    g.fillText(combo + '×', 0, 0);
    noGlow(g);
    g.globalAlpha = 1;
    var fuseW = Math.max(56 * S, 48 * S + combo * 2);
    var fuseH = Math.max(3, 4 * S);
    var fy = cfs + 6 * S;
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillRect(-fuseW * 0.5, fy, fuseW, fuseH);
    g.fillStyle = hot;
    g.fillRect(-fuseW * 0.5, fy, fuseW * fuse, fuseH);
    g.restore();
  }

  var barW = Math.min(W - pad * 2, narrow ? 220 * S : 260 * S);
  var barH = Math.max(4, 5 * S);
  var bx = (W - barW) * 0.5;
  var by = H - pad - barH - (isTouchUI() ? 88 : 10) * S;
  var ready = player.cd <= 0;
  var frac = ready ? 1 : clamp(1 - (player.cd / dashCd()), 0, 1);
  g.fillStyle = 'rgba(0,0,0,0.4)';
  g.fillRect(bx, by, barW, barH);
  g.fillStyle = ready ? COL.cyan : COL.red;
  g.fillRect(bx, by, barW * frac, barH);
  g.textAlign = 'center';
  g.textBaseline = 'bottom';
  mono(g, Math.max(11, 11 * S), '600');
  g.fillStyle = ready ? COL.mute : COL.red;
  g.fillText(ready ? 'blink ready' : ('wait  ' + player.cd.toFixed(1) + 's'), W * 0.5, by - 5 * S);
  if(player.chainWindow > 0 && ready){
    g.fillStyle = COL.cyan;
    g.globalAlpha = 0.5 + 0.5 * (player.chainWindow / CHAIN_WINDOW);
    g.fillText('chain', W * 0.5, by - 18 * S);
    g.globalAlpha = 1;
  }

  skipBtn.w = 0;
  if(tutorial.active){
    if(tutorial.prompt){
      var tfs = Math.max(15, Math.round(17 * S));
      uiFont(g, tfs, '700');
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      var ty = H * 0.17;
      g.fillStyle = 'rgba(12,11,16,0.72)';
      var tw = g.measureText(tutorial.prompt).width + 28 * S;
      g.fillRect(W * 0.5 - tw * 0.5, ty - 18 * S, tw, 36 * S);
      g.fillStyle = COL.white;
      g.fillText(tutorial.prompt, W * 0.5, ty);
    }
    var skW = Math.max(88, 100 * S);
    var skH = Math.max(34, (isTouchUI() ? 44 : 36) * S);
    skipBtn.x = W - pad - skW;
    skipBtn.y = pad;
    skipBtn.w = skW;
    skipBtn.h = skH;
    var skipHot = hitBtn(skipBtn, rawMouse.x, rawMouse.y);
    g.fillStyle = skipHot ? 'rgba(242,236,228,0.22)' : 'rgba(12,11,16,0.7)';
    g.fillRect(skipBtn.x, skipBtn.y, skipBtn.w, skipBtn.h);
    g.strokeStyle = COL.white;
    g.lineWidth = 1.5;
    g.strokeRect(skipBtn.x + 0.5, skipBtn.y + 0.5, skipBtn.w - 1, skipBtn.h - 1);
    displayFont(g, Math.max(13, 14 * S), '800');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.white;
    g.fillText('SKIP', skipBtn.x + skW * 0.5, skipBtn.y + skH * 0.52);
    mono(g, Math.max(10, 10 * S), '500');
    g.fillStyle = COL.mute;
    g.textBaseline = 'top';
    g.fillText(isTouchUI() ? 'tap to skip' : 'X to skip', skipBtn.x + skW * 0.5, skipBtn.y + skH + 4 * S);
    canvas.style.cursor = skipHot ? 'pointer' : 'none';
    drawControlOverlay(g, S);
  }

  if(goalBanner > 0 && !tutorial.active && wave <= 2){
    var ga = clamp(Math.min(1, goalBanner / 0.4) * Math.min(1, goalBanner), 0, 1);
    g.globalAlpha = ga;
    uiFont(g, Math.max(13, 14 * S), '600');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.mute;
    g.fillText('Survive waves · Collect coins · Upgrade', W * 0.5, H * 0.14);
    g.globalAlpha = 1;
  }

  if(waveBanner > 0 && !tutorial.active){
    var a = clamp(Math.min(1, waveBanner/0.35) * Math.min(1, (2.0-waveBanner)/0.18), 0, 1);
    g.globalAlpha = a;
    displayFont(g, Math.max(28, 36 * S), '800');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.white;
    g.shadowColor = 'rgba(0,0,0,0.8)';
    g.shadowBlur = 8;
    g.fillText('Wave ' + wave, W * 0.5, H * 0.2);
    noGlow(g);
    g.globalAlpha = 1;
  }

  if(paused){
    g.fillStyle = 'rgba(12,11,16,0.78)';
    g.fillRect(0, 0, W, H);
    displayFont(g, Math.max(36, 44 * S), '800');
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = COL.white;
    g.fillText('Paused', W * 0.5, H * 0.48);
    mono(g, Math.max(12, 13 * S), '600');
    g.fillStyle = COL.mute;
    g.fillText('press P', W * 0.5, H * 0.48 + 32 * S);
  }
  g.restore();
  noGlow(g);
}
