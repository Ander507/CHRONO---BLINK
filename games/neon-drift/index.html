<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040b">
<meta name="color-scheme" content="dark">
<title>Neon Drift</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05040b;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #btns{position:fixed;top:8px;right:10px;display:flex;gap:8px;z-index:2}
  #btns button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(32,244,255,.32);background:rgba(10,6,24,.6);
    color:#bdf9ff;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;transition:border-color .15s,background .15s}
  #btns button:hover{border-color:rgba(255,43,214,.7);background:rgba(30,8,40,.7)}
  #btns button:focus-visible{outline:2px solid #ff2bd6;outline-offset:2px}
  #btns svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #btns .hide{display:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Neon Drift game"></canvas>
<div id="safe"></div>
<div id="btns">
  <button id="bPause" class="hide" type="button" aria-label="Pause (P)" title="Pause (P)">
    <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
  </button>
  <button id="bMute" type="button" aria-label="Mute (M)" title="Mute (M)">
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mX" class="hide" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>
</div>
<script src="/sdk/v1/chronoblink.js"></script>
<script>
/*
 * NEON DRIFT — ChronoBlink Arcade. Single file, no external assets.
 *
 * SCORING (rate-bounded; all timing uses simulated run time t, which never exceeds wall-clock time)
 *  - Survival:   25 pts per second alive.
 *  - Shard:      100 x chain, chain 1..3 (+1 when picked within 4 s of the previous shard).
 *                Shards spawn from a timer that fires at most once per 1.5 s (first at t = 1.5 s),
 *                so at most floor(t / 1.5) shards exist per run  ->  <= 300 / 1.5 = 200 pts/s.
 *  - Close call: 50 pts for grazing a hazard, global cooldown 0.5 s   ->  <= 100 pts/s.
 *  HARD THEORETICAL MAX = 25 + 200 + 100 = 325 pts/s  (score <= 325 * t at every instant).
 *  Realistic expert after 3 min: 4,500 (time) + ~75 shards x ~210 (~15,700) + ~110 close calls (~5,500)
 *  ~= 25,000 pts (~140 pts/s). 10-minute run: hard cap 195,000; a plausible top run ~80,000-100,000.
 */
(function () {
'use strict';

var HARNESS = /[?&]harness=1(?:&|$)/.test(location.search);
var MONO = 'ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace';
var SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif';
var C = { cyan:'#20f4ff', magenta:'#ff2bd6', pink:'#ff2a6d', violet:'#9b5cff', amber:'#ffb52e', mint:'#6dffb8', white:'#ffffff' };

// ---------------------------------------------------------------- reduced motion
var rmq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
var reducedMotion = !!(rmq && rmq.matches);
try { rmq && rmq.addEventListener('change', function (e) { reducedMotion = e.matches; }); } catch (e) {}

// ---------------------------------------------------------------- SDK (+ standalone shim)

    __shim: true,
    init: function () { return Promise.resolve({ platform: 'standalone', player: { id: null, displayName: 'Player', isGuest: true }, settings: { muted: false } }); },
    loadingProgress: function () {}, loadingDone: function () {},
    gameplayStart: function () {}, gameplayStop: function () {},
    submitScore: function () { return Promise.resolve({ accepted: false, reason: 'standalone' }); },
    unlockAchievement: function () { return Promise.resolve({ unlocked: false }); },
    saveData: function (k, v) { var s = JSON.stringify(v); mem[k] = s; try { localStorage.setItem(P + k, s); } catch (e) {} return Promise.resolve(); },
    loadData: function (k) {

var SDK = (window.ChronoBlink && typeof window.ChronoBlink.init === 'function') ? window.ChronoBlink : makeShim();

window.addEventListener('error', function (e) { sdk('reportError', e.error || e.message); });

// ---------------------------------------------------------------- canvas & layout
var cv = document.getElementById('c');
var ctx = cv.getContext('2d', { alpha: false });
var btnBox = document.getElementById('btns');
var bMute = document.getElementById('bMute'), bPause = document.getElementById('bPause');
var safeEl = document.getElementById('safe');
var vw = 1, vh = 1, dpr = 1, scale = 1, ox = 0, oy = 0, hudH = 52, safeT = 0;
var WORLD_SHORT = 560, AW = 0, AH = 0;
var bg = document.createElement('canvas');

function resize() {
  vw = Math.max(1, window.innerWidth); vh = Math.max(1, window.innerHeight);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  var cs = getComputedStyle(safeEl);
  safeT = parseFloat(cs.paddingTop) || 0;
  var sR = parseFloat(cs.paddingRight) || 0, sB = parseFloat(cs.paddingBottom) || 0, sL = parseFloat(cs.paddingLeft) || 0;
  hudH = Math.max(48, Math.min(66, vh * 0.08));
  var side = Math.max(8, Math.min(18, Math.min(vw, vh) * 0.02));
  var aw = vw - side * 2 - sL - sR, ah = vh - hudH - safeT - side - sB;
  aw = Math.max(50, aw); ah = Math.max(50, ah);
  var ratio = Math.min(Math.max(aw, ah) / Math.min(aw, ah), 2.3);
  var nW = aw >= ah ? WORLD_SHORT * ratio : WORLD_SHORT, nH = aw >= ah ? WORLD_SHORT : WORLD_SHORT * ratio;
  if (AW && (nW !== AW || nH !== AH)) rescaleWorld(nW / AW, nH / AH);
  AW = nW; AH = nH;
  scale = Math.min(aw / AW, ah / AH);
  ox = sL + side + (aw - AW * scale) / 2;
  oy = safeT + hudH + (ah - AH * scale) / 2;
  btnBox.style.top = (safeT + (hudH - 38) / 2) + 'px';
  btnBox.style.right = (sR + side) + 'px';

}

function rescaleWorld(sx, sy) {
  function s(o) { o.x *= sx; o.y *= sy; }
  s(player); player.trail.forEach(s);
  mines.forEach(s); sparks.forEach(function (k) { s(k); k.trail.forEach(s); }); pulsars.forEach(s); shards.forEach(s);
  particles.forEach(s); texts.forEach(s);
  beams.forEach(function (b) { b.px *= sx; b.py *= sy; });
}

// ---------------------------------------------------------------- glow sprites
function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { var c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
var glowCache = {};
function glow(hex) {
  if (glowCache[hex]) return glowCache[hex];
  var g = document.createElement('canvas'); g.width = g.height = 128;
  var x = g.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(0.18, rgba(hex, 0.55)); gr.addColorStop(0.45, rgba(hex, 0.14)); gr.addColorStop(1, rgba(hex, 0));

}
function drawGlow(hex, x, y, size, a) {
  if (a <= 0) return;
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glow(hex), x - size / 2, y - size / 2, size, size); ctx.globalAlpha = 1;
}

function buildBackground() {
  bg.width = cv.width; bg.height = cv.height;
  var g = bg.getContext('2d'), W = bg.width, H = bg.height, M = Math.max(W, H);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#05040b'; g.fillRect(0, 0, W, H);
  function blob(x, y, r, hex, a) { var gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(hex, a)); gr.addColorStop(1, rgba(hex, 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  blob(W * 0.12, H * 0.05, M * 0.75, C.magenta, 0.10);
  blob(W * 0.95, H * 1.0, M * 0.7, C.cyan, 0.08);
  blob(W * 0.5, H * 0.5, M * 0.5, C.violet, 0.05);
  // arena floor + grid (world space)
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  g.fillStyle = 'rgba(14,8,32,0.55)'; g.fillRect(0, 0, AW, AH);
  var px = 1 / (dpr * scale), step = 40, i;
  g.lineWidth = px;
  for (i = 0; i <= AW; i += step) { g.strokeStyle = (Math.round(i / step) % 4 === 0) ? 'rgba(155,92,255,0.16)' : 'rgba(155,92,255,0.07)'; g.beginPath(); g.moveTo(i, 0); g.lineTo(i, AH); g.stroke(); }
  for (i = 0; i <= AH; i += step) { g.strokeStyle = (Math.round(i / step) % 4 === 0) ? 'rgba(155,92,255,0.16)' : 'rgba(155,92,255,0.07)'; g.beginPath(); g.moveTo(0, i); g.lineTo(AW, i); g.stroke(); }
  g.fillStyle = 'rgba(190,150,255,0.22)';
  for (i = 0; i <= AW; i += step * 2) for (var j = 0; j <= AH; j += step * 2) g.fillRect(i - px, j - px, px * 2.2, px * 2.2);
  // vignette (screen space)
  g.setTransform(1, 0, 0, 1, 0, 0);
  var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, M * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // stars outside the arena
  var rnd = mulberry(7);
  for (i = 0; i < 160; i++) {
    var sx = rnd() * W, sy = rnd() * H;
    var wx = (sx / dpr - ox) / scale, wy = (sy / dpr - oy) / scale;
    if (wx > -4 && wx < AW + 4 && wy > -4 && wy < AH + 4) continue;
    g.fillStyle = 'rgba(200,220,255,' + (0.15 + rnd() * 0.45) + ')'; g.fillRect(sx, sy, dpr * (rnd() < 0.15 ? 2 : 1), dpr * (rnd() < 0.15 ? 2 : 1));
  }
}
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------- audio (lazy WebAudio)

function syncAudioRunning() {

  start: function () { [262, 392, 523, 784].forEach(function (f, i) { tone(f, f * 1.01, 0.16, 'triangle', 0.22, i * 0.06); }); tone(110, 220, 0.4, 'sawtooth', 0.06); },
  pickup: function (chain) { var b = 880 * Math.pow(2, (chain - 1) * 4 / 12); tone(b, b * 1.5, 0.09, 'sine', 0.3); tone(b * 1.5, b * 2, 0.14, 'triangle', 0.16, 0.05); },
  near: function () { noise(0.18, 0.22, 'bandpass', 900, 5000); tone(1700, 2600, 0.08, 'sine', 0.1, 0.02); },
  zap: function () { tone(160, 70, 0.22, 'sawtooth', 0.06); noise(0.12, 0.05, 'highpass', 3000, 6000); },
  pulse: function () { tone(220, 60, 0.35, 'sine', 0.12); },
  death: function () { noise(0.9, 0.6, 'lowpass', 4000, 80); tone(240, 40, 0.8, 'sawtooth', 0.22); tone(90, 30, 0.9, 'sine', 0.35); },
  wave: function () { tone(523, 523, 0.12, 'square', 0.07); tone(784, 784, 0.18, 'square', 0.07, 0.13); },
  ach: function () { [659, 880, 1319].forEach(function (f, i) { tone(f, f, 0.22, 'triangle', 0.16, i * 0.08); }); }

function setMuted(m, persist) {

  document.getElementById('mWave').classList.toggle('hide', muted);
  document.getElementById('mX').classList.toggle('hide', !muted);
  bMute.setAttribute('aria-label', muted ? 'Unmute (M)' : 'Mute (M)');
  if (persist) sdk('saveData', 'settings', { muted: muted });
}

// ---------------------------------------------------------------- state
var state = 'title';            // 'title' | 'playing' | 'over'
var userPaused = false, platformPaused = false;
function frozen() { return platformPaused || (userPaused && state === 'playing'); }
var player = { x: 0, y: 0, vx: 0, vy: 0, a: -Math.PI / 2, alive: false, thrust: 0, trail: [], trailT: 0 };
var mines = [], beams = [], sparks = [], pulsars = [], shards = [], particles = [], texts = [];
var elapsed = 0, bonus = 0, shardsGot = 0, closeCalls = 0, chain = 1, lastShardT = -99, lastNearT = -99;
var finalScore = 0, best = 0, newBest = false, overT = 0, runId = 0, submitMsg = '', submitCol = C.cyan;
var D = {};
var shake = 0, flash = 0, animT = 0, announce = null, toast = null, playT = 0;
var achSession = {};
var PR = 7;                     // player hit radius (visual ~14)
var SHARD_INTERVAL = 1.5, SHARD_MAX = 3, CHAIN_WINDOW = 4, NEAR_CD = 0.5;
var comets = [];
var god = false;           // harness-only invulnerability for screenshots

function score() { return elapsed * 25 + bonus; }
function speedMult() { return Math.min(2.0, 1 + elapsed / 150); }
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  player.x = AW / 2; player.y = AH / 2; player.vx = player.vy = 0; player.a = -Math.PI / 2; player.alive = true; player.trail.length = 0;
  elapsed = 0; bonus = 0; shardsGot = 0; closeCalls = 0; chain = 1; lastShardT = -99; lastNearT = -99; newBest = false; playT = 0;
  D = { mineT: 1.0, beamT: 0.6, sparkT: 0.5, pulseT: 0.5, shardT: 0, wave: 0, ach60: false, ach25: false };
  announce = { text: 'DRIFT', sub: 'stay alive', t: 0, col: C.cyan };
  burst(player.x, player.y, C.cyan, 40, 260, 0.6);
  sfx.start();
  bPause.classList.remove('hide');
  sdk('gameplayStart');
  sdk('track', 'run_start', {});
  syncAudioRunning();

function die() {
  if (state !== 'playing' || !player.alive) return;
  player.alive = false; state = 'over'; overT = 0; userPaused = false;
  finalScore = Math.floor(score());
  burst(player.x, player.y, C.magenta, 110, 520, 1.1); burst(player.x, player.y, C.cyan, 70, 340, 0.9); burst(player.x, player.y, C.white, 30, 200, 0.5);
  if (!reducedMotion) { shake = 22; flash = 1; }
  sfx.death();
  bPause.classList.add('hide');
  if (finalScore > best) { best = finalScore; newBest = finalScore > 0; sdk('saveData', 'best', best); }
  sdk('gameplayStop');
  var myRun = runId;
  submitMsg = 'Submitting score…'; submitCol = 'rgba(200,220,255,0.6)';
  sdk('submitScore', { leaderboard: 'highscore', score: finalScore }).then(function (r) {
    if (myRun !== runId) return;
    if (!r || typeof r !== 'object') { submitMsg = platform === 'standalone' ? 'Offline · best saved on this device' : 'Score not submitted'; submitCol = 'rgba(200,220,255,0.55)'; return; }
    if (typeof r.best === 'number' && r.best > best) best = Math.floor(r.best);
    if (r.reason === 'guest') { submitMsg = 'Sign in on ChronoBlink to rank'; submitCol = C.amber; }
    else if (r.reason === 'standalone') { submitMsg = 'Offline · best saved on this device'; submitCol = 'rgba(200,220,255,0.55)'; }
    else if (r.provisional) { submitMsg = 'Provisional leaderboard' + (r.rank ? ' · rank #' + r.rank : ''); submitCol = C.amber; }
    else if (r.accepted) { submitMsg = 'Score submitted' + (r.rank ? ' · rank #' + r.rank : ''); submitCol = C.mint; }
    else { submitMsg = 'Score not ranked' + (r.reason ? ' (' + r.reason + ')' : ''); submitCol = 'rgba(255,150,190,0.8)'; }

function unlock(key, label) {
  if (achSession[key]) return;
  achSession[key] = true;
  sdk('unlockAchievement', key);
  toast = { text: label, t: 0 };
  sfx.ach();
}

// ---------------------------------------------------------------- input
var keys = { up: false, down: false, left: false, right: false };

  ctx.drawImage(bg, 0, 0);
  var sx = 0, sy = 0;
  if (shake > 0 && !reducedMotion) { sx = (Math.random() * 2 - 1) * shake; sy = (Math.random() * 2 - 1) * shake; }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sx), dpr * (oy + sy));
  drawWorld();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (state !== 'title') { drawHUD(); drawAnnounce(); }
  drawJoystick();
  if (state === 'title') drawTitle();
  else if (state === 'over') drawOver();
  else if (frozen()) drawPaused();
  drawToast();
  if (flash > 0 && !reducedMotion) { ctx.fillStyle = 'rgba(255,120,230,' + flash * 0.45 + ')'; ctx.fillRect(0, 0, vw, vh); }
}

// ---------------------------------------------------------------- main loop
var last = 0, acc = 0, STEP = 1 / 120;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  try {
    if (!frozen()) {
      animT += dt; acc += dt;
      var n = 0; while (acc >= STEP && n < 14) { step(STEP); acc -= STEP; n++; }
      if (n >= 14) acc = 0;
    } else acc = 0;
    render();
  } catch (e) { sdk('reportError', e); if (HARNESS) throw e; }
}

// ---------------------------------------------------------------- boot
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

try {
  SDK.on && SDK.on('pause', function () { platformPaused = true; keys.up = keys.down = keys.left = keys.right = false; joy.id = null; syncAudioRunning(); });
  SDK.on && SDK.on('resume', function () { platformPaused = false; syncAudioRunning(); });
  SDK.on && SDK.on('mute', function () { setMuted(true, false); });
  SDK.on && SDK.on('unmute', function () { setMuted(false, false); });
} catch (e) {}

resize();
player.x = AW / 2; player.y = AH / 2;
for (var i0 = 0; i0 < 5; i0++) { spawnMine(0.8, 0); var mm = mines[mines.length - 1]; mm.x = rand(40, AW - 40); mm.y = rand(40, AH - 40); mm.inside = true; mm.t = 1; }
requestAnimationFrame(frame);
sdk('loadingProgress', 0.3);

(function boot() {
  var initP = sdk('init');
  Promise.race([initP, timeout(1500, null)]).then(function (info) {
    if (info && info.platform) platform = info.platform;
    sdk('loadingProgress', 0.7);
    return Promise.race([Promise.all([sdk('loadData', 'settings'), sdk('loadData', 'best')]), timeout(1500, [null, null])]).then(function (r) {
      var st = r && r[0], b = r && r[1];
      if (typeof b === 'number' && isFinite(b) && b > best) best = Math.floor(b);
      var m = !!(st && st.muted);
      if (info && info.settings && info.settings.muted) m = true;   // platform mute wins
      setMuted(m, false);
    });
  }).then(null, function (e) { sdk('reportError', e); }).then(function () {
    sdk('loadingProgress', 1);
    sdk('loadingDone');
  });
  // a late init (after the 1.5 s race) still applies the platform mute
  initP.then(function (info) { if (info && info.platform) platform = info.platform; if (info && info.settings && info.settings.muted) setMuted(true, false); });
})();

if (HARNESS) {
  window.__GAME__ = {
    get: function () { return { state: state, score: state === 'over' ? finalScore : Math.floor(score()), elapsed: elapsed, alive: player.alive && state === 'playing', best: best }; },
    start: function () { startRun(); },
    kill: function () { if (state === 'playing') die(); },
    setScore: function (n) { bonus = (Number(n) || 0) - elapsed * 25; },
    debug: { warp: function (t) { if (state === 'playing') { elapsed = t; D.wave = Math.floor(t / 20) - 1; D.ach60 = t >= 60; } }, god: function (on) { god = !!on; } }
  };
}
})();
</script>
</body>
